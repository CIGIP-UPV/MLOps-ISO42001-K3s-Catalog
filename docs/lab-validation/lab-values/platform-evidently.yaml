# Laboratory setting: same 1-second feature vectors as the training job and
# a short window of recent data for the end-to-end drift test.
driftCheck:
  bucket: "1 second"
  currentWindow: "4 minutes"
  minCurrentRows: 60
  schedule: "*/10 * * * *"
  # Short enough for re-running the end-to-end test (--phases) the same day.
  cooldown: "15 minutes"
