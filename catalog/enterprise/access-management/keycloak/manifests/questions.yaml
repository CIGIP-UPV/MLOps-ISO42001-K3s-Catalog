# =============================================================================
# Rancher Questions: Keycloak (Identity and Access Management)
# ISO/IEC 42001: B.6.1.3.1, B.8.0.2.1
# Variables are prefixed with the subchart name (keycloak.). The ai-system
# realm (roles and OIDC clients) is defined in values.yaml.
# =============================================================================
categories:
  - "Enterprise"
  - "Access Management"

questions:
  - variable: keycloak.auth.adminUser
    label: "Admin User"
    type: string
    default: "admin"
    group: "Authentication"

  - variable: keycloak.auth.existingSecret
    label: "Admin Credentials Secret"
    description: "Key admin-password (created by install.sh)"
    type: string
    default: "enterprise-keycloak-admin"
    group: "Authentication"

  - variable: keycloak.ingress.enabled
    label: "Enable Ingress"
    type: boolean
    default: false
    group: "Networking"

  - variable: keycloak.ingress.hostname
    label: "Hostname"
    type: hostname
    default: "keycloak.enterprise.local"
    show_if: "keycloak.ingress.enabled=true"
    group: "Networking"

  - variable: keycloak.externalDatabase.host
    label: "PostgreSQL Host"
    type: string
    default: "platform-postgresql.platform.svc.cluster.local"
    group: "Database"

  - variable: keycloak.externalDatabase.existingSecret
    label: "Database Credentials Secret"
    description: "Key password of the keycloak role"
    type: string
    default: "enterprise-keycloak-db"
    group: "Database"

  - variable: keycloak.keycloakConfigCli.enabled
    label: "Import the ai-system Realm"
    description: "Roles operator, data-scientist, compliance-officer, production-manager and admin; OIDC clients"
    type: boolean
    default: true
    group: "Realm"

  - variable: keycloak.metrics.enabled
    label: "Enable Prometheus Metrics"
    type: boolean
    default: true
    group: "Monitoring"

  - variable: keycloak.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "1536Mi"
    group: "Resources"
