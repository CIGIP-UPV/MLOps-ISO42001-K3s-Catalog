# =============================================================================
# Keycloak: Identity and Access Management
# Helm chart: bitnami/keycloak
# Tier: Enterprise | RA Component: User Access & Oversight (CMP-07)
# ISO/IEC 42001: B.6.1.3.1, B.8.0.2.1
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "enterprise-keycloak"
  mlops-iso42001.cigip-upv.es/tier: "enterprise"
  mlops-iso42001.cigip-upv.es/B.6.1.3.1: "true"
  mlops-iso42001.cigip-upv.es/B.8.0.2.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-07: "true"
# END iso42001-labels

keycloak:
  # The chart's own NetworkPolicy allows ingress from every namespace and all
  # egress; policies add up, so it would open the default deny of the catalog
  # (infrastructure/01-network-policies.yaml), which defines the conduits.
  networkPolicy:
    enabled: false
  commonLabels: *iso42001Labels

  # Bitnami versioned images now live in docker.io/bitnamilegacy (frozen,
  # no new security patches). The tag is the one the chart was built for:
  # older images still expect the removed KEYCLOAK_PROXY variable and refuse
  # to start in production mode without TLS. Replace with a maintained
  # image in production.
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak
    tag: 25.0.6-debian-12-r0

  # Admin credentials: Secret created by install.sh (key admin-password).
  auth:
    adminUser: admin
    existingSecret: enterprise-keycloak-admin
    passwordSecretKey: admin-password

  production: true
  # TLS terminated by the ingress; Keycloak trusts the X-Forwarded-* headers.
  proxyHeaders: xforwarded
  # Reachable through port-forward in the laboratory; enable the ingress
  # with TLS for users.
  ingress:
    enabled: false
    ingressClassName: traefik
    hostname: keycloak.enterprise.local

  # Database: platform PostgreSQL (database and role "keycloak" created by
  # platform-postgresql); password from a Secret created by install.sh.
  postgresql:
    enabled: false
  externalDatabase:
    host: platform-postgresql.platform.svc.cluster.local
    port: 5432
    database: keycloak
    user: keycloak
    existingSecret: enterprise-keycloak-db
    existingSecretPasswordKey: password

  extraEnvVars:
    # Hostname taken from the request (port-forward or ingress)
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_FEATURES
      value: "token-exchange,admin-fine-grained-authz"
    # Login and admin events logged (B.6.2.8.1)
    - name: KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL
      value: "info"
    - name: KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_ERROR_LEVEL
      value: "warn"

  # ---------------------------------------------------------------------------
  # Realm import: roles and OIDC clients of the AI system realm
  # ---------------------------------------------------------------------------
  keycloakConfigCli:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/keycloak-config-cli
      tag: 6.1.6-debian-12-r3
    configuration:
      ai-system-realm.json: |
        {
          "realm": "ai-system",
          "enabled": true,
          "sslRequired": "external",
          "registrationAllowed": false,
          "eventsEnabled": true,
          "eventsExpiration": 7776000,
          "adminEventsEnabled": true,
          "adminEventsDetailsEnabled": true,
          "roles": {
            "realm": [
              {
                "name": "operator",
                "description": "Machine operators: view predictions, provide feedback"
              },
              {
                "name": "data-scientist",
                "description": "Model training, evaluation, MLflow access"
              },
              {
                "name": "compliance-officer",
                "description": "Audit log access, model approval, ISO documentation"
              },
              {
                "name": "production-manager",
                "description": "KPI dashboards, model promotion approval"
              },
              {
                "name": "admin",
                "description": "Full platform administration"
              }
            ]
          },
          "clients": [
            {
              "clientId": "grafana",
              "enabled": true,
              "protocol": "openid-connect",
              "publicClient": false,
              "redirectUris": ["http://grafana.platform.local/*"],
              "webOrigins": ["http://grafana.platform.local"],
              "defaultClientScopes": ["openid", "profile", "email"]
            },
            {
              "clientId": "mlflow",
              "enabled": true,
              "protocol": "openid-connect",
              "publicClient": false,
              "redirectUris": ["http://mlflow.platform.local/*"],
              "webOrigins": ["http://mlflow.platform.local"]
            },
            {
              "clientId": "minio",
              "enabled": true,
              "protocol": "openid-connect",
              "publicClient": false,
              "redirectUris": ["http://minio.platform.local/*"],
              "webOrigins": ["http://minio.platform.local"]
            },
            {
              "clientId": "zammad",
              "enabled": true,
              "protocol": "openid-connect",
              "publicClient": false,
              "redirectUris": ["http://helpdesk.enterprise.local/*"],
              "webOrigins": ["http://helpdesk.enterprise.local"]
            },
            {
              "clientId": "feedback-interface",
              "name": "Feedback interface (CMP-12)",
              "description": "Operator verdicts on predictions; sign-in from the server side of the interface",
              "enabled": true,
              "protocol": "openid-connect",
              "publicClient": true,
              "standardFlowEnabled": false,
              "implicitFlowEnabled": false,
              "directAccessGrantsEnabled": true,
              "serviceAccountsEnabled": false,
              "attributes": { "access.token.lifespan": "900" }
            }
          ],
          "browserSecurityHeaders": {
            "contentSecurityPolicy": "frame-src 'self'; frame-ancestors 'self'; object-src 'none';"
          }
        }

  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1500m"
      memory: "1536Mi"

  # Prometheus metrics (B.6.1.2.2). Keycloak 25 serves them on the
  # management interface (port 9000), which this chart version predates.
  extraContainerPorts:
    - name: management
      containerPort: 9000
      protocol: TCP
  metrics:
    enabled: true
    service:
      extraPorts:
        - name: management
          port: 9000
          protocol: TCP
          targetPort: management
    serviceMonitor:
      enabled: true
      port: management
      endpoints:
        - path: /metrics
