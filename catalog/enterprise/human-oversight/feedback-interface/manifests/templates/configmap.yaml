# =============================================================================
# Application code and HTML templates of the feedback interface (files/)
# ISO/IEC 42001: B.6.1.3.3, B.6.2.6.4
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "enterprise-feedback-interface.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "enterprise-feedback-interface.labels" . | nindent 4 }}
data:
  app.py: |
{{ .Files.Get "files/app.py" | indent 4 }}
{{- range $path, $_ := .Files.Glob "files/templates/*.html" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
