{{- if .Values.ingress.enabled }}
# Optional Ingress; enable it together with TLS (session cookies).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "enterprise-feedback-interface.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "enterprise-feedback-interface.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "enterprise-feedback-interface.fullname" . }}
                port:
                  name: http
{{- end }}
