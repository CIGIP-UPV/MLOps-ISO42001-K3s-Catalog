# =============================================================================
# Feedback interface Deployment
# Tier: Enterprise | RA Component: Feedback Interface (CMP-12)
# ISO/IEC 42001: B.6.1.3.3, B.6.2.6.4
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterprise-feedback-interface.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "enterprise-feedback-interface.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "enterprise-feedback-interface.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/app: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "enterprise-feedback-interface.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: feedback-interface
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "/app",
                    "--proxy-headers", "--no-server-header"]
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TEMPLATE_DIR
              value: /app/templates
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: DB_HOST
              value: {{ .Values.dataStock.host | quote }}
            - name: DB_PORT
              value: {{ .Values.dataStock.port | quote }}
            - name: DB_NAME
              value: {{ .Values.dataStock.database | quote }}
            - name: DB_USER
              value: {{ .Values.dataStock.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dataStock.existingSecret }}
                  key: {{ .Values.dataStock.passwordKey }}
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: VERDICT_ROLES
              value: {{ join "," .Values.roles.verdict | quote }}
            - name: SUSPEND_ROLES
              value: {{ join "," .Values.roles.suspend | quote }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.session.existingSecret }}
                  key: {{ .Values.session.secretKey }}
            - name: SESSION_TTL
              value: {{ .Values.session.ttlSeconds | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.session.secureCookie | quote }}
            - name: MLFLOW_TRACKING_URI
              value: {{ .Values.registry.trackingUri | quote }}
            - name: MODEL_NAME
              value: {{ .Values.registry.modelName | quote }}
            - name: MODEL_ALIAS
              value: {{ .Values.registry.alias | quote }}
            - name: LOOKBACK
              value: {{ .Values.predictions.lookback | quote }}
            - name: PAGE_SIZE
              value: {{ .Values.predictions.pageSize | quote }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: app
              mountPath: /app/app.py
              subPath: app.py
              readOnly: true
            - name: templates
              mountPath: /app/templates
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: app
          configMap:
            name: {{ include "enterprise-feedback-interface.fullname" . }}-app
        - name: templates
          configMap:
            name: {{ include "enterprise-feedback-interface.fullname" . }}-app
            items:
            {{- range $path, $_ := .Files.Glob "files/templates/*.html" }}
              - key: {{ base $path }}
                path: {{ base $path }}
            {{- end }}
        - name: tmp
          emptyDir: {}
