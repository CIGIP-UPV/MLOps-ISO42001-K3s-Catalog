# =============================================================================
# Feedback Interface: operator verdicts on model predictions
# Tier: Enterprise | RA Component: Feedback Interface (CMP-12)
# ISO/IEC 42001: B.6.1.3.3, B.6.2.6.4
# Operators review the recent predictions (consolidated in the platform data
# stock) and record a verdict: correct, incorrect or uncertain, with an
# optional corrected label and comment. Supervisors can suspend the model
# version in service; edge-mlflow-sync propagates the suspension to the edge.
# The verdicts are labels for the training job (release criteria).
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "enterprise-feedback-interface"
  mlops-iso42001.cigip-upv.es/tier: "enterprise"
  mlops-iso42001.cigip-upv.es/B.6.1.3.3: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.4: "true"
  mlops-iso42001.cigip-upv.es/CMP-12: "true"
# END iso42001-labels

image:
  repository: ghcr.io/burakince/mlflow   # same image as the model server and the training job
  tag: "2.22.1"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
replicaCount: 1
logLevel: INFO

# Platform data stock: reads predictions, writes operator_feedback (role
# feedback, created by the schema Job of platform-timescaledb).
dataStock:
  host: platform-timescaledb.platform.svc.cluster.local
  port: 5432
  database: zdm_platform
  user: feedback
  existingSecret: enterprise-feedback-db
  passwordKey: password

# Sign-in against the AI system realm (client feedback-interface of
# enterprise-keycloak) from the server side of the interface.
keycloak:
  url: http://enterprise-keycloak.security.svc.cluster.local
  realm: ai-system
  clientId: feedback-interface

# Realm roles: verdict may record verdicts; suspend may also suspend and
# resume the version in service.
roles:
  verdict: [operator, production-manager, compliance-officer]
  suspend: [production-manager, compliance-officer]

# Signed session cookie; set secureCookie to true behind TLS.
session:
  existingSecret: enterprise-feedback-session
  secretKey: secret-key
  ttlSeconds: 1800
  secureCookie: false

# Model registry (suspension tags on the version the alias points to).
registry:
  trackingUri: http://platform-mlflow.mlops.svc.cluster.local:5000
  modelName: zdm-anomaly-detector
  alias: champion

predictions:
  lookback: "24 hours"
  pageSize: 50

service:
  type: ClusterIP
  port: 8000

# Reachable inside the cluster only (port-forward); enable with TLS.
ingress:
  enabled: false
  className: ""
  host: feedback.enterprise.local
  tls: []

metrics:
  serviceMonitor:
    enabled: true
    interval: 30s

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: "50m"
    memory: "192Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

nodeSelector: {}
tolerations: []
affinity: {}
