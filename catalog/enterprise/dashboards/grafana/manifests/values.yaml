# =============================================================================
# Grafana Dashboards (Overlay): enterprise dashboards of the AI system
# Tier: Enterprise | RA Components: Information Centre (CMP-06),
#       Goal-Oriented Monitoring (CMP-11, enterprise view), Business Dashboard
# ISO/IEC 42001: B.6.1.3.3, B.6.2.6.2
# Provisioned into the Grafana of platform-grafana, whose sidecar loads every
# ConfigMap labelled grafana_dashboard=1. The data source uids (prometheus,
# loki, timescaledb, edgepg) are those provisioned by platform-grafana.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "enterprise-grafana-dashboards"
  mlops-iso42001.cigip-upv.es/tier: "enterprise"
  mlops-iso42001.cigip-upv.es/B.6.1.3.3: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.2: "true"
  mlops-iso42001.cigip-upv.es/CMP-06: "true"
  mlops-iso42001.cigip-upv.es/CMP-11: "true"
# END iso42001-labels

# Grafana folder of the dashboards.
folder: "ZDM AI System"

# Dashboards to provision (files/dashboards/<name>.json).
dashboards:
  zdm-model-health: true        # CMP-10: served version, outcomes, latency
  zdm-input-data: true          # CMP-01: validated and rejected plant data
  zdm-data-drift: true          # CMP-02/11/14: consolidation, OEE, drift
  zdm-security-audit: true      # CMP-15/09: Falco, API audit, job events
  zdm-edge-predictions: true    # CMP-03: predictions and version history
