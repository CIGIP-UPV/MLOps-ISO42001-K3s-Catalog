# =============================================================================
# Rancher Questions: Grafana Dashboards (Enterprise Overlay)
# ISO/IEC 42001: B.6.1.3.3, B.6.2.6.2
# =============================================================================
categories:
  - "Enterprise"
  - "Dashboards"

questions:
  - variable: folder
    label: "Grafana Folder"
    type: string
    default: "ZDM AI System"
    group: "Dashboards"

  - variable: dashboards.zdm-model-health
    label: "Model Health (CMP-10)"
    type: boolean
    default: true
    group: "Dashboards"

  - variable: dashboards.zdm-input-data
    label: "Input Data Monitoring (CMP-01)"
    type: boolean
    default: true
    group: "Dashboards"

  - variable: dashboards.zdm-data-drift
    label: "Data Consolidation, KPIs and Drift (CMP-02, CMP-11, CMP-14)"
    type: boolean
    default: true
    group: "Dashboards"

  - variable: dashboards.zdm-security-audit
    label: "Security Events and Audit Trail (CMP-15, CMP-09)"
    type: boolean
    default: true
    group: "Dashboards"

  - variable: dashboards.zdm-edge-predictions
    label: "Edge Predictions and Model Versions"
    type: boolean
    default: true
    group: "Dashboards"

  - variable: dashboards.zdm-operator-feedback
    label: "Operator Feedback (CMP-12)"
    description: "Verdicts recorded with enterprise-feedback-interface"
    type: boolean
    default: true
    group: "Dashboards"
