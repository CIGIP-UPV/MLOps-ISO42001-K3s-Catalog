# =============================================================================
# Rancher Questions: MinIO Docs Overlay (Enterprise Document Store)
# ISO/IEC 42001: B.6.2.3.1, B.6.2.6.5
# Buckets, folders and retention are declared in values.yaml (buckets).
# =============================================================================
categories:
  - "Enterprise"
  - "Document Store"

questions:
  - variable: minio.endpoint
    label: "MinIO Endpoint"
    description: "S3 endpoint of platform-minio"
    type: string
    default: "http://platform-minio.minio.svc.cluster.local:9000"
    group: "Target"

  - variable: minio.rootSecret
    label: "MinIO Root Credentials Secret"
    description: "Secret of platform-minio (keys rootUser, rootPassword), same namespace"
    type: string
    default: "platform-minio-root"
    group: "Target"

  - variable: buckets[0].retention.days
    label: "Retention of iso42001-docs (days)"
    description: "Default object lock retention (governance mode)"
    type: int
    default: 365
    group: "Retention"

  - variable: buckets[2].retention.days
    label: "Retention of audit-evidence (days)"
    type: int
    default: 1825
    group: "Retention"

  - variable: auditorPolicy.name
    label: "Auditor Policy Name"
    type: string
    default: "iso42001-docs-read"
    group: "Access"
