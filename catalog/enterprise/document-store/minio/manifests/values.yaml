# =============================================================================
# MinIO Docs Overlay: Document Store (enterprise)
# Tier: Enterprise | RA Component: Document Store (CMP-05)
# ISO/IEC 42001: B.6.2.3.1, B.6.2.6.5
# A Job creates the document store buckets in the platform MinIO
# (platform-minio): versioned buckets for ISO/IEC 42001 documentation, model
# cards and audit evidence, with object locking and default retention where
# evidence must be immutable, plus a read-only policy for auditors. Object
# locking can only be enabled when a bucket is created.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "enterprise-minio-overlay"
  mlops-iso42001.cigip-upv.es/tier: "enterprise"
  mlops-iso42001.cigip-upv.es/B.6.2.3.1: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.5: "true"
  mlops-iso42001.cigip-upv.es/CMP-05: "true"
# END iso42001-labels

minio:
  endpoint: http://platform-minio.minio.svc.cluster.local:9000
  # Secret of platform-minio with the keys rootUser and rootPassword
  # (same namespace).
  rootSecret: platform-minio-root

mcImage:
  repository: quay.io/minio/mc
  tag: RELEASE.2024-11-21T17-21-54Z

buckets:
  # System documentation, deployment plan, update and repair plan
  # (B.6.2.3.1, B.6.2.5.1, B.6.2.6.5)
  - name: iso42001-docs
    versioning: true
    objectLocking: true
    retention: { mode: governance, days: 365 }
    folders:
      - architecture
      - deployment-plan
      - update-repair-plan
      - risk-assessment
      - compliance-review
  # Model cards and evaluation reports
  - name: model-cards
    versioning: true
    objectLocking: false
    folders: []
  # Audit evidence (exports of logs, drift reports, sign-offs)
  - name: audit-evidence
    versioning: true
    objectLocking: true
    retention: { mode: governance, days: 1825 }
    folders: []

# Read-only access for auditors to the documentation buckets.
auditorPolicy:
  name: iso42001-docs-read
  buckets: [iso42001-docs, model-cards, audit-evidence]

job:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
