# =============================================================================
# Zammad: AI Helpdesk and Incident Management
# Helm chart: zammad/zammad
# Tier: Enterprise | RA Component: AI Helpdesk (CMP-13)
# ISO/IEC 42001: B.6.2.6.6, B.8.0.4.1, B.8.0.5.1
# Image of the chart (ghcr.io/zammad/zammad, tag = chart appVersion). Data in
# the platform PostgreSQL; Elasticsearch, Redis and Memcached as subcharts.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "enterprise-zammad"
  mlops-iso42001.cigip-upv.es/tier: "enterprise"
  mlops-iso42001.cigip-upv.es/B.6.2.6.6: "true"
  mlops-iso42001.cigip-upv.es/B.8.0.4.1: "true"
  mlops-iso42001.cigip-upv.es/B.8.0.5.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-13: "true"
# END iso42001-labels

zammad:
  # The upstream chart exposes pod annotations but no label hook; install.sh
  # adds the iso42001 labels with infrastructure/iso42001-postrender.py.

  # Passwords from Secrets created by install.sh (letters and digits only:
  # the chart builds connection URLs without encoding).
  secrets:
    postgresql:
      useExisting: true
      secretName: enterprise-zammad-db
      secretKey: postgresql-pass
    redis:
      useExisting: true
      secretName: enterprise-zammad-redis
      secretKey: redis-password

  zammadConfig:
    postgresql:
      enabled: false                   # platform-postgresql, database "zammad"
      host: platform-postgresql.platform.svc.cluster.local
      port: 5432
      db: zammad
      user: zammad
    redis:
      enabled: true
    memcached:
      enabled: true
    elasticsearch:
      enabled: true
    minio:
      enabled: false
    railsserver:
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { cpu: 1000m, memory: 1536Mi }
    scheduler:
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits: { cpu: 500m, memory: 1Gi }
    websocket:
      resources:
        requests: { cpu: 20m, memory: 128Mi }
        limits: { cpu: 500m, memory: 512Mi }
    nginx:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 200m, memory: 128Mi }
    initContainers:
      volumePermissions:
        image:
          repository: public.ecr.aws/docker/library/alpine
          tag: "3.18.4"

  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi

  ingress:
    enabled: false
    className: traefik
    hosts:
      - host: helpdesk.enterprise.local
        paths:
          - path: /
            pathType: Prefix

  # ---------------------------------------------------------------------------
  # Subcharts (Bitnami images from docker.io/bitnamilegacy, frozen: replace
  # with maintained images in production)
  # ---------------------------------------------------------------------------
  elasticsearch:
    commonLabels: *iso42001Labels
    image:
      registry: docker.io
      repository: bitnamilegacy/elasticsearch
    sysctlImage:
      registry: docker.io
      repository: bitnamilegacy/os-shell
    volumePermissions:
      image:
        registry: docker.io
        repository: bitnamilegacy/os-shell
    master:
      heapSize: 512m
      persistence:
        size: 5Gi
      resources:
        requests: { cpu: 100m, memory: 1Gi }
        limits: { cpu: 1000m, memory: 1536Mi }

  redis:
    commonLabels: *iso42001Labels
    architecture: standalone
    auth:
      existingSecret: enterprise-zammad-redis
      existingSecretPasswordKey: redis-password
    image:
      registry: docker.io
      repository: bitnamilegacy/redis
    master:
      persistence:
        size: 1Gi
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { cpu: 250m, memory: 256Mi }

  memcached:
    commonLabels: *iso42001Labels
    image:
      registry: docker.io
      repository: bitnamilegacy/memcached
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
