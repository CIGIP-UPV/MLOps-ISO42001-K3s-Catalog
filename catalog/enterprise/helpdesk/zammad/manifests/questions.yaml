# =============================================================================
# Rancher Questions: Zammad (AI Helpdesk)
# ISO/IEC 42001: B.6.2.6.6, B.8.0.4.1, B.8.0.5.1
# Variables are prefixed with the subchart name (zammad.).
# =============================================================================
categories:
  - "Enterprise"
  - "Helpdesk"

questions:
  - variable: zammad.zammadConfig.postgresql.host
    label: "PostgreSQL Host"
    type: string
    default: "platform-postgresql.platform.svc.cluster.local"
    group: "Database"

  - variable: zammad.secrets.postgresql.secretName
    label: "Database Password Secret"
    description: "Key postgresql-pass (created by install.sh)"
    type: string
    default: "enterprise-zammad-db"
    group: "Database"

  - variable: zammad.zammadConfig.elasticsearch.enabled
    label: "Deploy Elasticsearch"
    description: "Full-text search; needs about 1.5 GiB of memory"
    type: boolean
    default: true
    group: "Search"

  - variable: zammad.persistence.size
    label: "Attachments Volume Size"
    type: string
    default: "5Gi"
    group: "Storage"

  - variable: zammad.ingress.enabled
    label: "Enable Ingress"
    type: boolean
    default: false
    group: "Networking"

  - variable: zammad.ingress.hosts[0].host
    label: "Hostname"
    type: hostname
    default: "helpdesk.enterprise.local"
    show_if: "zammad.ingress.enabled=true"
    group: "Networking"
