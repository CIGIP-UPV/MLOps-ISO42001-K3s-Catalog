# =============================================================================
# TimescaleDB: Platform Time-Series Data Stock
# Image: timescale/timescaledb (official, PostgreSQL 16)
# Tier: Platform | RA Component: Data Stock (CMP-02, platform),
#                 Goal-Oriented Monitoring (CMP-11)
# ISO/IEC 42001: B.6.2.6.1, B.6.2.6.3
# The deprecated timescale/timescaledb-single chart was replaced by these
# templates (its last release, 0.33.1, rejects the catalog values schema).
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-timescaledb"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.2.6.1: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.3: "true"
  mlops-iso42001.cigip-upv.es/CMP-02: "true"
  mlops-iso42001.cigip-upv.es/CMP-11: "true"
# END iso42001-labels

image:
  repository: timescale/timescaledb
  tag: "2.17.2-pg16"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Database created on first start (consolidated edge data, KPIs, drift).
database: zdm_platform

# ---------------------------------------------------------------------------
# Credentials: Secret created by install.sh. Keys:
#   postgres-password  superuser
#   sync-password      role "sync": writes consolidated edge data
#   ml-password        role "ml": reads training data, writes drift results
#   grafana-password   role "grafana": read-only access for dashboards
# ---------------------------------------------------------------------------
auth:
  existingSecret: platform-timescaledb-auth

# postgresql.conf parameters passed as -c flags.
parameters:
  shared_buffers: "256MB"
  effective_cache_size: "768MB"
  work_mem: "16MB"
  max_connections: "100"
  timescaledb.max_background_workers: "8"
  log_statement: "mod"                  # B.6.2.8.1
  log_min_duration_statement: "1000"
  log_connections: "on"
  log_disconnections: "on"

persistence:
  enabled: true
  storageClass: local-path
  size: 20Gi

service:
  type: ClusterIP
  port: 5432

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

# postgres-exporter sidecar (B.6.2.6.1)
metrics:
  enabled: true
  image:
    repository: quay.io/prometheuscommunity/postgres-exporter
    tag: "v0.15.0"
  # Created only when the Prometheus Operator CRDs are present.
  serviceMonitor:
    enabled: true
    interval: 30s

nodeSelector: {}
tolerations: []
affinity: {}
