# =============================================================================
# Rancher Questions: TimescaleDB (Platform Time-Series Data Stock)
# ISO/IEC 42001: B.6.2.6.1, B.6.2.6.3
# =============================================================================
categories:
  - "Platform"
  - "Data Management"

questions:

  - variable: database
    label: "Database"
    description: "Consolidated edge data, OEE KPIs and drift results"
    type: string
    default: "zdm_platform"
    group: "Database"

  - variable: auth.existingSecret
    label: "Credentials Secret"
    description: "Keys postgres-password, sync-password, ml-password and grafana-password (created by install.sh)"
    type: string
    default: "platform-timescaledb-auth"
    group: "Database"

  - variable: image.tag
    label: "TimescaleDB Image Tag"
    type: string
    default: "2.17.2-pg16"
    group: "Database"

  - variable: persistence.storageClass
    label: "Storage Class"
    type: storageclass
    default: "local-path"
    group: "Storage"

  - variable: persistence.size
    label: "Volume Size"
    description: "Scale with the retention of consolidated sensor data"
    type: string
    default: "20Gi"
    group: "Storage"

  - variable: metrics.enabled
    label: "Enable postgres-exporter Sidecar"
    description: "ISO/IEC 42001: B.6.2.6.1"
    type: boolean
    default: true
    group: "Monitoring"

  - variable: metrics.serviceMonitor.enabled
    label: "Create ServiceMonitor"
    description: "Only rendered when the Prometheus Operator CRDs exist"
    type: boolean
    default: true
    group: "Monitoring"

  - variable: resources.requests.memory
    label: "Memory Request"
    type: string
    default: "512Mi"
    group: "Resources"

  - variable: resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "2Gi"
    group: "Resources"
