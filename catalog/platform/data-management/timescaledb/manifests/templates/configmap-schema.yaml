# =============================================================================
# Idempotent schema of the platform data stock (files/schema.sql), applied by
# the schema Job on every install and upgrade.
# ISO/IEC 42001: B.6.2.6.1, B.6.2.6.3, B.6.1.3.3
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-timescaledb.fullname" . }}-schema
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-timescaledb.labels" . | nindent 4 }}
data:
  schema.sql: |
{{ .Files.Get "files/schema.sql" | indent 4 }}
