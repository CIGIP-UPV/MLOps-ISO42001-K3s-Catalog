# =============================================================================
# PostgreSQL: Platform Metadata Store
# Helm chart: bitnami/postgresql
# Tier: Platform | RA Component: Data Stock (CMP-02, platform)
# Purpose: shared metadata backend for MLflow, Keycloak, Zammad and Grafana
# ISO/IEC 42001: B.6.1.3.4
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-postgresql"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.1.3.4: "true"
  mlops-iso42001.cigip-upv.es/CMP-02: "true"
# END iso42001-labels

postgresql:
  # The chart's own NetworkPolicy allows ingress from every namespace and all
  # egress; policies add up, so it would open the default deny of the catalog
  # (infrastructure/01-network-policies.yaml), which defines the conduits.
  # This chart sets it per role (primary.networkPolicy, readReplicas.networkPolicy).
  commonLabels: *iso42001Labels

  # Bitnami versioned images now live in docker.io/bitnamilegacy (frozen,
  # no new security patches). Replace with a maintained image in production.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r14

  architecture: standalone

  # ---------------------------------------------------------------------------
  # Authentication: the admin password comes from a Secret created by
  # install.sh (key postgres-password).
  # ---------------------------------------------------------------------------
  auth:
    existingSecret: platform-postgresql-auth

  primary:
    networkPolicy:
      enabled: false
    persistence:
      enabled: true
      storageClass: local-path
      size: 20Gi

    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

    extendedConfiguration: |
      max_connections = 200
      shared_buffers = 256MB
      work_mem = 8MB
      log_statement = 'mod'
      log_min_duration_statement = 1000

    # Passwords of the service users, read by the init script below.
    # Secret created by install.sh with the keys MLFLOW_DB_PASSWORD,
    # KEYCLOAK_DB_PASSWORD, ZAMMAD_DB_PASSWORD and GRAFANA_DB_PASSWORD.
    extraEnvVarsSecret: platform-postgresql-app-passwords

    # One database and one owner per platform service. Runs once, on first
    # start; no password is written in the chart.
    initdb:
      scripts:
        01-service-databases.sh: |
          #!/bin/bash
          # Sourced by the Bitnami entrypoint: the subshell keeps the shell
          # options below from leaking into the entrypoint.
          (
            set -euo pipefail
            export PGPASSWORD="${POSTGRES_PASSWORD}"
            for svc in mlflow keycloak zammad grafana; do
              var="$(echo "${svc}" | tr '[:lower:]' '[:upper:]')_DB_PASSWORD"
              pw="${!var}"
              psql -v ON_ERROR_STOP=1 -U postgres -d postgres -v svc="${svc}" -v pw="${pw}" <<'SQL'
          SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'svc', :'pw')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'svc') \gexec
          SELECT format('CREATE DATABASE %I OWNER %I', :'svc', :'svc')
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'svc') \gexec
          SQL
            done
          )

  metrics:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgres-exporter
    serviceMonitor:
      enabled: true
      labels: *iso42001Labels

  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
