# =============================================================================
# Rancher Questions: PostgreSQL (Platform Metadata Store)
# ISO/IEC 42001: B.6.1.3.4
# Variables are prefixed with the subchart name (postgresql.).
# =============================================================================
categories:
  - "Platform"
  - "Data Management"

questions:

  # ---- Authentication ----
  - variable: postgresql.auth.existingSecret
    label: "Admin Credentials Secret"
    description: "Secret with the key postgres-password (created by install.sh)"
    type: string
    default: "platform-postgresql-auth"
    group: "Authentication"

  - variable: postgresql.primary.extraEnvVarsSecret
    label: "Service Users Secret"
    description: "Secret with MLFLOW_DB_PASSWORD, KEYCLOAK_DB_PASSWORD, ZAMMAD_DB_PASSWORD and GRAFANA_DB_PASSWORD"
    type: string
    default: "platform-postgresql-app-passwords"
    group: "Authentication"

  # ---- Persistence ----
  - variable: postgresql.primary.persistence.storageClass
    label: "Storage Class"
    type: storageclass
    default: "local-path"
    group: "Storage"

  - variable: postgresql.primary.persistence.size
    label: "Volume Size"
    type: string
    default: "20Gi"
    group: "Storage"

  # ---- Monitoring ----
  - variable: postgresql.metrics.enabled
    label: "Enable Prometheus Exporter"
    type: boolean
    default: true
    group: "Monitoring"

  - variable: postgresql.metrics.serviceMonitor.enabled
    label: "Enable ServiceMonitor"
    description: "Requires the Prometheus Operator CRDs (platform-prometheus)"
    type: boolean
    default: true
    group: "Monitoring"

  # ---- Resources ----
  - variable: postgresql.primary.resources.requests.cpu
    label: "CPU Request"
    type: string
    default: "100m"
    group: "Resources"

  - variable: postgresql.primary.resources.requests.memory
    label: "Memory Request"
    type: string
    default: "256Mi"
    group: "Resources"

  - variable: postgresql.primary.resources.limits.cpu
    label: "CPU Limit"
    type: string
    default: "1000m"
    group: "Resources"

  - variable: postgresql.primary.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "1Gi"
    group: "Resources"
