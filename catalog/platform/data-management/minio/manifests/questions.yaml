# =============================================================================
# Rancher Questions: MinIO (Platform Object Storage)
# ISO/IEC 42001: B.6.2.3.1, B.6.2.5.1
# Variables are prefixed with the subchart name (minio.).
# =============================================================================
categories:
  - "Platform"
  - "Data Management"

questions:
  - variable: minio.mode
    label: "Deployment Mode"
    type: enum
    default: "standalone"
    options: ["standalone", "distributed"]
    group: "General"

  - variable: minio.existingSecret
    label: "Root Credentials Secret"
    description: "Keys rootUser and rootPassword (created by install.sh)"
    type: string
    default: "platform-minio-root"
    group: "Authentication"

  - variable: minio.persistence.size
    label: "Volume Size"
    type: string
    default: "50Gi"
    group: "Storage"

  - variable: minio.persistence.storageClass
    label: "Storage Class"
    type: storageclass
    default: "local-path"
    group: "Storage"

  - variable: minio.ingress.enabled
    label: "Expose the S3 API through Ingress"
    type: boolean
    default: false
    group: "Networking"

  - variable: minio.consoleIngress.enabled
    label: "Expose the Console through Ingress"
    type: boolean
    default: false
    group: "Networking"

  - variable: minio.metrics.serviceMonitor.enabled
    label: "Create ServiceMonitor"
    description: "Requires the Prometheus Operator CRDs (platform-prometheus)"
    type: boolean
    default: true
    group: "Monitoring"

  - variable: minio.resources.requests.memory
    label: "Memory Request"
    type: string
    default: "512Mi"
    group: "Resources"

  - variable: minio.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "2Gi"
    group: "Resources"
