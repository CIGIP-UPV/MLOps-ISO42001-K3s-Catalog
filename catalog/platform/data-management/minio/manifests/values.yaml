# =============================================================================
# MinIO: S3-Compatible Object Storage (platform)
# Helm chart: minio/minio
# Tier: Platform | RA Components: Data Stock (CMP-02, platform), storage
#                 backend of the Document Store (CMP-05)
# ISO/IEC 42001: B.6.2.3.1, B.6.2.5.1
# Platform buckets (model artefacts, datasets, log chunks). The document
# store buckets of the enterprise tier are created by enterprise-minio-overlay.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-minio"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.2.3.1: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.5.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-02: "true"
  mlops-iso42001.cigip-upv.es/CMP-05: "true"
# END iso42001-labels

minio:
  additionalLabels: *iso42001Labels
  podLabels: *iso42001Labels

  mode: standalone                     # 'distributed' for HA (4+ drives)

  # Root credentials: Secret created by install.sh (keys rootUser, rootPassword).
  existingSecret: platform-minio-root

  persistence:
    enabled: true
    storageClass: local-path
    size: 50Gi

  service:
    type: ClusterIP
    port: 9000
  consoleService:
    type: ClusterIP
    port: 9001

  # Reachable inside the cluster; enable the Ingresses with TLS if needed.
  ingress:
    enabled: false
  consoleIngress:
    enabled: false

  # ---------------------------------------------------------------------------
  # Buckets of the platform tier
  # ---------------------------------------------------------------------------
  buckets:
    # MLflow model artefacts, served through the MLflow server (B.6.1.3.2)
    - name: mlflow-artifacts
      policy: none
      purge: false
      versioning: true
      objectlocking: false
    # Dataset catalogue: curated training and validation datasets
    - name: datasets
      policy: none
      purge: false
      versioning: true
      objectlocking: false
    # Loki chunks and index: long-term log archive (CMP-09, B.6.2.8.1)
    - name: loki-logs
      policy: none
      purge: false
      versioning: false
      objectlocking: false

  # ---------------------------------------------------------------------------
  # Least-privilege service users (passwords from the Secret
  # platform-minio-users, keys mlflow and loki, created by install.sh)
  # ---------------------------------------------------------------------------
  policies:
    - name: mlflow-artifacts-rw
      statements:
        - resources:
            - "arn:aws:s3:::mlflow-artifacts"
            - "arn:aws:s3:::mlflow-artifacts/*"
          actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket", "s3:GetBucketLocation"]
    - name: loki-logs-rw
      statements:
        - resources:
            - "arn:aws:s3:::loki-logs"
            - "arn:aws:s3:::loki-logs/*"
          actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket", "s3:GetBucketLocation"]

  users:
    - accessKey: mlflow
      existingSecret: platform-minio-users
      existingSecretKey: mlflow
      policy: mlflow-artifacts-rw
    - accessKey: loki
      existingSecret: platform-minio-users
      existingSecretKey: loki
      policy: loki-logs-rw

  # Prometheus metrics (B.6.1.2.2); needs the Prometheus Operator CRDs.
  metrics:
    serviceMonitor:
      enabled: true
      public: true
      additionalLabels: *iso42001Labels

  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
