categories:
  - Security
questions:
  - variable: vault.server.ha.enabled
    default: false
    description: "Enable HA mode (Raft storage, 3 replicas). Requires additional nodes; leave disabled for single-node / edge deployments."
    type: boolean
    label: Enable HA mode
    group: "Deployment topology"
  - variable: vault.server.ha.replicas
    default: 3
    description: "Raft replica count when HA is enabled."
    type: int
    label: HA replicas
    show_if: "vault.server.ha.enabled=true"
    group: "Deployment topology"
  - variable: vault.server.dataStorage.size
    default: "10Gi"
    description: "Persistent volume size for Vault data."
    type: string
    label: Data storage size
    group: "Persistence"
  - variable: vault.server.dataStorage.storageClass
    default: "local-path"
    description: "StorageClass for Vault data volume."
    type: string
    label: StorageClass
    group: "Persistence"
  - variable: vault.server.auditStorage.enabled
    default: true
    description: "Enable audit log storage (required for ISO/IEC 42001 traceability)."
    type: boolean
    label: Enable audit storage
    group: "Persistence"
  - variable: vault.server.ingress.enabled
    default: false
    description: "Expose the Vault UI / API via ingress. Leave disabled if only cluster-internal clients need access."
    type: boolean
    label: Expose Vault through ingress
    group: "Networking"
  - variable: vault.server.ingress.hosts[0].host
    default: "vault.platform.local"
    description: "Hostname for the Vault ingress route."
    type: string
    label: Ingress hostname
    show_if: "vault.server.ingress.enabled=true"
    group: "Networking"
  - variable: vault.injector.enabled
    default: true
    description: "Install Vault Agent Injector so pods can request secrets through annotations."
    type: boolean
    label: Enable Agent Injector
    group: "Integrations"
  - variable: bootstrap.enabled
    default: true
    description: "Run post-install bootstrap job to enable KV, PKI and database secrets engines for MLOps workloads."
    type: boolean
    label: Bootstrap MLOps secrets engines
    group: "Bootstrap"
