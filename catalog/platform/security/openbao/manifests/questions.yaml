# =============================================================================
# Rancher Questions: OpenBao (secrets management)
# ISO/IEC 42001: B.6.1.3.3, B.6.1.4.1, B.8.0.2.1
# =============================================================================
categories:
  - "Platform"
  - "Security"

questions:
  - variable: openbao.server.image.tag
    label: "OpenBao Version"
    type: string
    default: "2.0.0"
    group: "General"

  - variable: openbao.global.tlsDisable
    label: "Disable TLS"
    description: "Keep false: the listener uses a certificate from the platform CA (platform-cert-manager)"
    type: boolean
    default: false
    group: "Security"

  - variable: tls.issuerName
    label: "ClusterIssuer of the TLS Certificate"
    type: string
    default: "platform-ca"
    group: "Security"

  - variable: openbao.server.dataStorage.size
    label: "Data Volume Size"
    type: string
    default: "5Gi"
    group: "Storage"

  - variable: openbao.server.auditStorage.size
    label: "Audit Volume Size"
    type: string
    default: "2Gi"
    group: "Storage"

  - variable: openbao.ui.enabled
    label: "Enable Web UI"
    type: boolean
    default: true
    group: "General"
