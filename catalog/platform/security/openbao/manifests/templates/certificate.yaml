# =============================================================================
# TLS certificate of the OpenBao listener (issued by the platform CA)
# ISO/IEC 42001: B.6.1.4.1
# =============================================================================
{{- if and (not .Values.openbao.global.tlsDisable) (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-openbao.labels" . | nindent 4 }}
spec:
  secretName: openbao-tls
  duration: {{ .Values.tls.duration }}
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - {{ .Release.Name }}
    - {{ .Release.Name }}.{{ .Release.Namespace }}
    - {{ .Release.Name }}.{{ .Release.Namespace }}.svc
    - {{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: {{ .Values.tls.issuerName }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
