# =============================================================================
# OpenBao: secrets management for the platform
# Helm chart: openbao/openbao (Linux Foundation fork of HashiCorp Vault,
# MPL-2.0)
# Tier: Platform | RA Components: User Access & Oversight (CMP-07, Access
#       Control subcomponent), Security Monitoring (CMP-15)
# ISO/IEC 42001: B.6.1.3.3, B.6.1.4.1, B.8.0.2.1
# Single server with file storage and an audit volume. The TLS listener uses
# a certificate issued by the platform CA of platform-cert-manager.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-openbao"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.1.3.3: "true"
  mlops-iso42001.cigip-upv.es/B.6.1.4.1: "true"
  mlops-iso42001.cigip-upv.es/B.8.0.2.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-07: "true"
  mlops-iso42001.cigip-upv.es/CMP-15: "true"
# END iso42001-labels

openbao:
  enabled: true

  global:
    tlsDisable: false

  server:
    extraLabels: *iso42001Labels
    image:
      registry: quay.io
      repository: openbao/openbao
      tag: "2.0.0"

    # TLS material written by cert-manager (Certificate in templates/),
    # exposed at /openbao/userconfig/openbao-tls/.
    extraVolumes:
      - type: secret
        name: openbao-tls
    extraEnvironmentVars:
      BAO_CACERT: /openbao/userconfig/openbao-tls/ca.crt

    dataStorage:
      enabled: true
      size: 5Gi
      storageClass: local-path
    # Volume for the file audit device (enable it after initialisation:
    # bao audit enable file file_path=/openbao/audit/audit.log).
    auditStorage:
      enabled: true
      size: 2Gi
      storageClass: local-path

    standalone:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable     = 0
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file   = "/openbao/userconfig/openbao-tls/tls.crt"
          tls_key_file    = "/openbao/userconfig/openbao-tls/tls.key"
        }
        storage "file" {
          path = "/openbao/data"
        }
        telemetry {
          prometheus_retention_time = "24h"
          disable_hostname = true
        }
    ha:
      enabled: false

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    ingress:
      enabled: false

  ui:
    enabled: true
    serviceType: ClusterIP

  # No catalog workload uses the agent injector; it is disabled (its image,
  # hashicorp/vault-k8s, is the only HashiCorp component of the upstream chart).
  injector:
    enabled: false
  csi:
    enabled: false

# Certificate of the TLS listener, issued by platform-cert-manager.
tls:
  issuerName: platform-ca
  duration: 8760h
