# =============================================================================
# Platform PKI: self-signed root, internal CA and ClusterIssuers
# ISO/IEC 42001: B.6.1.4.1 (security of AI assets: keys and certificates)
# =============================================================================
{{- if .Capabilities.APIVersions.Has "cert-manager.io/v1" }}
{{- with .Values.issuers.platformCA }}
{{- if .enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .issuerName }}-selfsigned-root
  labels:
    {{- include "platform-cert-manager.labels" $ | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "platform-cert-manager.labels" $ | nindent 4 }}
spec:
  isCA: true
  commonName: {{ .commonName | quote }}
  secretName: {{ .secretName }}
  duration: {{ .duration }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ .issuerName }}-selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .issuerName }}
  labels:
    {{- include "platform-cert-manager.labels" $ | nindent 4 }}
spec:
  ca:
    secretName: {{ .secretName }}
{{- end }}
{{- end }}
{{- with .Values.issuers.letsencrypt }}
{{- if .enabled }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  labels:
    {{- include "platform-cert-manager.labels" $ | nindent 4 }}
spec:
  acme:
    email: {{ required "issuers.letsencrypt.email is required" .email }}
    server: {{ .server }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .ingressClass }}
{{- end }}
{{- end }}
{{- end }}
