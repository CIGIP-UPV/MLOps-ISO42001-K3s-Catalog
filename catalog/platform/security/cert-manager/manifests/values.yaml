# =============================================================================
# cert-manager: X.509 certificate lifecycle and the platform internal CA
# Helm chart: jetstack/cert-manager
# Tier: Platform | RA Component: Security Monitoring (CMP-15, identity and
#       transport security of the platform)
# ISO/IEC 42001: B.6.1.4.1, B.6.2.3.1
# The wrapper adds the platform PKI: a self-signed root, the internal CA
# certificate and the ClusterIssuer "platform-ca" that other charts use
# (for example platform-openbao for its TLS listener).
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-cert-manager"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.1.4.1: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.3.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-15: "true"
# END iso42001-labels

cert-manager:
  # false when a cert-manager already runs in the cluster (for example the
  # one installed with Rancher): only the issuers below are then created.
  enabled: true
  global:
    commonLabels: *iso42001Labels
  crds:
    enabled: true
    keep: true
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
  webhook:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 200m, memory: 128Mi }
  cainjector:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 200m, memory: 256Mi }

# ---------------------------------------------------------------------------
# Issuers. Rendered only when the cert-manager.io/v1 API is available: on a
# fresh cluster run the upgrade a second time (install.sh does so).
# ---------------------------------------------------------------------------
issuers:
  # Internal platform CA (self-signed root -> CA certificate -> ClusterIssuer)
  platformCA:
    enabled: true
    issuerName: platform-ca
    commonName: "ZDM MLOps platform CA"
    duration: "87600h"               # 10 years
    secretName: platform-ca
  # Let's Encrypt (needs a public DNS name reachable on port 80 for HTTP-01)
  letsencrypt:
    enabled: false
    email: ""
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    ingressClass: traefik
