# =============================================================================
# Rancher Questions: cert-manager (platform PKI)
# ISO/IEC 42001: B.6.1.4.1, B.6.2.3.1
# =============================================================================
categories:
  - "Platform"
  - "Security"

questions:
  - variable: cert-manager.enabled
    label: "Install cert-manager"
    description: "Disable when the cluster already runs cert-manager (for example with Rancher): only the issuers are created"
    type: boolean
    default: true
    group: "cert-manager"

  - variable: issuers.platformCA.enabled
    label: "Create the Platform Internal CA"
    type: boolean
    default: true
    group: "Issuers"

  - variable: issuers.platformCA.commonName
    label: "CA Common Name"
    type: string
    default: "ZDM MLOps platform CA"
    show_if: "issuers.platformCA.enabled=true"
    group: "Issuers"

  - variable: issuers.letsencrypt.enabled
    label: "Create a Let's Encrypt ClusterIssuer"
    description: "Needs a public DNS name reachable on port 80"
    type: boolean
    default: false
    group: "Issuers"

  - variable: issuers.letsencrypt.email
    label: "ACME Account E-mail"
    type: string
    default: ""
    show_if: "issuers.letsencrypt.enabled=true"
    group: "Issuers"

  - variable: issuers.letsencrypt.server
    label: "ACME Server"
    type: enum
    default: "https://acme-staging-v02.api.letsencrypt.org/directory"
    options:
      - "https://acme-staging-v02.api.letsencrypt.org/directory"
      - "https://acme-v02.api.letsencrypt.org/directory"
    show_if: "issuers.letsencrypt.enabled=true"
    group: "Issuers"
