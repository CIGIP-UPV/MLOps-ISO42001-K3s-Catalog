# =============================================================================
# Rancher: Multi-Cluster Kubernetes Management
# Helm chart: rancher-latest/rancher (2.11 is the first release whose chart
# accepts Kubernetes 1.32)
# Tier: Platform | Orchestration (cross-cutting; no RA component of its own)
# ISO/IEC 42001: B.6.2.5.1
# Do not install when the cluster is already managed by a Rancher server.
# The upstream chart has no label hook: install.sh adds the iso42001 labels
# with its post-renderer.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-rancher"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.2.5.1: "true"
# END iso42001-labels

rancher:
  hostname: rancher.platform.local

  # TLS: certificate signed by Rancher's own CA through cert-manager
  # (install platform-cert-manager first). Use letsEncrypt only with a
  # public DNS name, setting letsEncrypt.ingress.class.
  ingress:
    tls:
      source: rancher
    ingressClassName: traefik
    extraAnnotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure

  letsEncrypt:
    email: ""
    environment: production
    ingress:
      class: traefik

  replicas: 1                          # 3 for HA

  # Empty: Rancher generates a random bootstrap password stored in the
  # Secret cattle-system/bootstrap-secret (no password in the chart).
  bootstrapPassword: ""

  # API audit log (B.6.2.8.1), written to a sidecar and shipped by Fluent Bit.
  auditLog:
    level: 1                           # 1 = metadata
    maxAge: 90
    maxBackup: 10
    maxSize: 100

  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "3Gi"
