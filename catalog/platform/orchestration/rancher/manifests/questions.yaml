# =============================================================================
# Rancher Questions: Rancher (multi-cluster management)
# ISO/IEC 42001: B.6.2.5.1
# Variables are prefixed with the subchart name (rancher.).
# =============================================================================
categories:
  - "Platform"
  - "Orchestration"

questions:
  - variable: rancher.hostname
    label: "Rancher Hostname"
    type: hostname
    default: "rancher.platform.local"
    required: true
    group: "General"

  - variable: rancher.replicas
    label: "Replicas"
    type: int
    default: 1
    min: 1
    max: 3
    group: "General"

  - variable: rancher.ingress.tls.source
    label: "TLS Source"
    type: enum
    default: "rancher"
    options: ["rancher", "letsEncrypt", "secret"]
    group: "TLS"

  - variable: rancher.letsEncrypt.email
    label: "Let's Encrypt E-mail"
    type: string
    default: ""
    show_if: "rancher.ingress.tls.source=letsEncrypt"
    group: "TLS"

  - variable: rancher.auditLog.level
    label: "API Audit Log Level"
    description: "0 off, 1 metadata, 2 request, 3 request and response (ISO/IEC 42001: B.6.2.8.1)"
    type: int
    default: 1
    min: 0
    max: 3
    group: "Audit"
