# =============================================================================
# Rancher Questions: Argo CD (GitOps Continuous Delivery)
# ISO/IEC 42001: B.6.2.5.1, B.6.2.6.4, B.6.2.8.1
# Variables are prefixed with the subchart name (argo-cd.).
# =============================================================================
categories:
  - "Platform"
  - "Orchestration"

questions:
  - variable: argo-cd.global.domain
    label: "Argo CD Domain"
    type: hostname
    default: "argocd.platform.local"
    group: "General"

  - variable: argo-cd.server.ingress.enabled
    label: "Enable Ingress"
    type: boolean
    default: false
    group: "Networking"

  - variable: argo-cd.configs.cm.admin\.enabled
    label: "Enable Local Admin Account"
    description: "Disable once Keycloak single sign-on is configured"
    type: boolean
    default: true
    group: "Security"

  - variable: argo-cd.configs.rbac.policy\.default
    label: "Default RBAC Role"
    type: enum
    default: "role:readonly"
    options: ["role:readonly", ""]
    group: "Security"

  - variable: argo-cd.notifications.enabled
    label: "Enable Notifications Controller"
    type: boolean
    default: true
    group: "General"

  - variable: argo-cd.controller.replicas
    label: "Application Controller Replicas"
    type: int
    default: 1
    group: "Scaling"

  - variable: bootstrap.enabled
    label: "Create the Catalog AppProject and Applications"
    description: "Enable on an upgrade, after the first install has created the Argo CD CRDs"
    type: boolean
    default: false
    group: "GitOps Bootstrap"
