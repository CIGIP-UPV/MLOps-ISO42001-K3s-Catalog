# =============================================================================
# Argo CD: GitOps Continuous Delivery
# Helm chart: argoproj/argo-cd
# Tier: Platform | RA Component: Version Control (CMP-03, configuration and
#       deployment state under version control)
# ISO/IEC 42001: B.6.2.5.1, B.6.2.6.4, B.6.2.8.1
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-argocd"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.2.5.1: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.4: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.8.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-03: "true"
# END iso42001-labels

argo-cd:
  global:
    domain: argocd.platform.local
    additionalLabels: *iso42001Labels
    logging:
      format: json
      level: info

  crds:
    additionalLabels: *iso42001Labels

  # argocd-cm and argocd-rbac-cm (Argo CD 2.x reads them from configs.*).
  configs:
    cm:
      admin.enabled: true
      exec.enabled: false
      kustomize.buildOptions: "--enable-helm"
      # Keycloak single sign-on (B.6.1.3.1): add oidc.config once
      # enterprise-keycloak is installed and the client secret is stored in
      # argocd-secret (key oidc.keycloak.clientSecret).
    rbac:
      policy.default: role:readonly
      policy.csv: |
        p, role:platform-admin, applications, *, */*, allow
        p, role:platform-admin, clusters, *, *, allow
        p, role:platform-admin, projects, *, *, allow
        g, ai-platform-admins, role:platform-admin
    params:
      server.insecure: true            # TLS terminated by the ingress, if any

  server:
    replicas: 1
    ingress:
      enabled: false
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  repoServer:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  controller:
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }

  applicationSet:
    replicas: 1
  notifications:
    enabled: true
  redis:
    enabled: true
  redis-ha:
    enabled: false
  dex:
    enabled: false                     # Keycloak OIDC directly

# ---------------------------------------------------------------------------
# GitOps bootstrap: an AppProject for the catalog and the Applications it
# manages. Enable it on an upgrade, after the first install has created the
# Argo CD CRDs.
# ---------------------------------------------------------------------------
bootstrap:
  enabled: false
  project: iso42001-catalog
  sourceRepos:
    - https://github.com/CIGIP-UPV/MLOps-ISO42001-K3s-Catalog
    - https://cigip-upv.github.io/MLOps-ISO42001-K3s-Catalog
  destinationNamespaces: [edge, logging, falco, platform, mlops, minio, monitoring, security, helpdesk]
  # Example:
  # applications:
  #   - name: enterprise-grafana-dashboards
  #     namespace: monitoring
  #     repoURL: https://cigip-upv.github.io/MLOps-ISO42001-K3s-Catalog
  #     chart: enterprise-grafana-dashboards
  #     targetRevision: 0.3.0
  applications: []
