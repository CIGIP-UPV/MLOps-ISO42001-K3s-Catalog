# =============================================================================
# Rancher Questions: MLflow (Experiment Tracking and Model Registry)
# ISO/IEC 42001: B.6.1.3.2, B.6.1.3.4, B.6.2.6.4
# Variables are prefixed with the subchart name (mlflow.).
# =============================================================================
categories:
  - "Platform"
  - "AI Lifecycle"

questions:

  - variable: mlflow.image.tag
    label: "MLflow Version"
    type: string
    default: "2.22.1"
    group: "General"

  - variable: mlflow.replicaCount
    label: "Replicas"
    type: int
    default: 1
    min: 1
    max: 3
    group: "General"

  # ---- Backend store ----
  - variable: mlflow.backendStore.postgres.host
    label: "PostgreSQL Host"
    type: string
    default: "platform-postgresql.platform.svc.cluster.local"
    group: "Backend Store (metadata)"

  - variable: mlflow.backendStore.postgres.database
    label: "Database"
    type: string
    default: "mlflow"
    group: "Backend Store (metadata)"

  - variable: mlflow.backendStore.existingDatabaseSecret.name
    label: "Database Credentials Secret"
    description: "Secret with the keys username and password (created by install.sh)"
    type: string
    default: "platform-mlflow-db"
    group: "Backend Store (metadata)"

  # ---- Artefact store ----
  - variable: mlflow.artifactRoot.s3.bucket
    label: "Artefact Bucket"
    type: string
    default: "mlflow-artifacts"
    group: "Artefact Store (MinIO)"

  - variable: mlflow.extraEnvVars.MLFLOW_S3_ENDPOINT_URL
    label: "S3 Endpoint"
    type: string
    default: "http://platform-minio.minio.svc.cluster.local:9000"
    group: "Artefact Store (MinIO)"

  - variable: mlflow.artifactRoot.proxiedArtifactStorage
    label: "Serve Artefacts through MLflow"
    description: "Clients download models over HTTP without object storage credentials"
    type: boolean
    default: true
    group: "Artefact Store (MinIO)"

  # ---- Exposure ----
  - variable: mlflow.ingress.enabled
    label: "Enable Ingress"
    type: boolean
    default: false
    group: "Networking"

  - variable: mlflow.ingress.hosts[0].host
    label: "Hostname"
    type: hostname
    default: "mlflow.platform.local"
    show_if: "mlflow.ingress.enabled=true"
    group: "Networking"

  # ---- Monitoring ----
  - variable: mlflow.serviceMonitor.enabled
    label: "Enable Prometheus Metrics"
    description: "Exposes /mlflow/metrics and a ServiceMonitor (ISO/IEC 42001: B.6.1.2.2)"
    type: boolean
    default: true
    group: "Monitoring"

  # ---- Resources ----
  - variable: mlflow.resources.requests.memory
    label: "Memory Request"
    type: string
    default: "512Mi"
    group: "Resources"

  - variable: mlflow.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "2Gi"
    group: "Resources"
