# =============================================================================
# MLflow: Experiment Tracking and Model Registry
# Helm chart: community-charts/mlflow
# Tier: Platform | RA Component: Version Control (CMP-03, platform)
# ISO/IEC 42001: B.6.1.3.2, B.6.1.3.4, B.6.2.6.4
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-mlflow"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.1.3.2: "true"
  mlops-iso42001.cigip-upv.es/B.6.1.3.4: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.4: "true"
  mlops-iso42001.cigip-upv.es/CMP-03: "true"
# END iso42001-labels

mlflow:
  # The upstream chart exposes no label hook for its pods; install.sh adds
  # the iso42001 labels with infrastructure/iso42001-postrender.py.

  # burakince/mlflow bundles the PostgreSQL (psycopg2) and S3 (boto3)
  # drivers that the official ghcr.io/mlflow/mlflow image lacks. Pulled from
  # GHCR to avoid the anonymous Docker Hub rate limit.
  image:
    repository: ghcr.io/burakince/mlflow
    tag: "2.22.1"
    pullPolicy: IfNotPresent

  replicaCount: 1

  # ---------------------------------------------------------------------------
  # Backend store: platform PostgreSQL, database and role "mlflow".
  # Credentials from a Secret created by install.sh (keys username, password).
  # ---------------------------------------------------------------------------
  backendStore:
    databaseMigration: true
    databaseConnectionCheck: false   # its init container pulls busybox from Docker Hub
    postgres:
      enabled: true
      host: platform-postgresql.platform.svc.cluster.local
      port: 5432
      database: mlflow
    existingDatabaseSecret:
      name: platform-mlflow-db
      usernameKey: username
      passwordKey: password

  # ---------------------------------------------------------------------------
  # Artefact store: MinIO bucket mlflow-artifacts, served through the MLflow
  # server (--serve-artifacts). Clients, including the edge, upload and
  # download models over HTTP and never hold object storage credentials.
  # ---------------------------------------------------------------------------
  artifactRoot:
    proxiedArtifactStorage: true
    s3:
      enabled: true
      bucket: mlflow-artifacts
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY of the MinIO mlflow user.
  extraSecretNamesForEnvFrom:
    - platform-mlflow-s3
  extraEnvVars:
    MLFLOW_S3_ENDPOINT_URL: "http://platform-minio.minio.svc.cluster.local:9000"
    AWS_DEFAULT_REGION: "us-east-1"

  service:
    type: ClusterIP
    port: 5000

  ingress:
    enabled: false
    className: traefik
    hosts:
      - host: mlflow.platform.local
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

  # Prometheus metrics at /mlflow/metrics (B.6.1.2.2); needs the Prometheus
  # Operator CRDs, so install platform-prometheus first.
  serviceMonitor:
    enabled: true
    labels: *iso42001Labels
