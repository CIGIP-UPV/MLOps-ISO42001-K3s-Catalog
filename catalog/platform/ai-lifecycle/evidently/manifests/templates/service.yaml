apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-evidently
  labels:
    {{- include "platform-evidently.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
  selector:
    {{- include "platform-evidently.selectorLabels" . | nindent 4 }}
