# =============================================================================
# Drift check and Retraining Recommendation (CMP-14)
#   1. extract   (MLflow image)    reference data of the served version and
#                                  recent data of the platform data stock
#   2. drift     (Evidently image) DataDriftPreset report, stored in the UI
#   3. recommend (MLflow image)    recommendation in TimescaleDB, report in
#                                  MLflow, retraining Job above the threshold
# ISO/IEC 42001: B.6.2.6.2, B.6.2.8.1, B.8.0.5.1
# =============================================================================
{{- if .Values.driftCheck.enabled }}
{{- $env := list }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "platform-evidently.fullname" . }}-drift
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-evidently.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.driftCheck.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "platform-evidently.labels" . | nindent 8 }}
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            {{- include "platform-evidently.labels" . | nindent 12 }}
            app.kubernetes.io/component: drift-check
          annotations:
            checksum/scripts: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        spec:
          restartPolicy: Never
          {{- if .Values.driftCheck.autoRetrain }}
          serviceAccountName: {{ include "platform-evidently.fullname" . }}-drift
          {{- else }}
          automountServiceAccountToken: false
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            - name: extract
              image: "{{ .Values.driftCheck.image.repository }}:{{ .Values.driftCheck.image.tag }}"
              command: ["python", "/app/extract.py"]
              env:
                {{- include "platform-evidently.driftEnv" . | nindent 16 }}
              volumeMounts: &mounts
                - { name: scripts, mountPath: /app, readOnly: true }
                - { name: work, mountPath: /work }
              resources:
                {{- toYaml .Values.driftCheck.resources | nindent 16 }}
            - name: drift
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["python", "/app/drift.py"]
              env:
                - { name: HOME, value: /tmp }
                - { name: WORK_DIR, value: /work }
                - { name: EVIDENTLY_DISABLE_TELEMETRY, value: "1" }
                - name: EVIDENTLY_UI_URL
                  value: "http://{{ include "platform-evidently.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
                - { name: PROJECT, value: {{ .Values.driftCheck.modelName | quote }} }
              volumeMounts: *mounts
              resources:
                {{- toYaml .Values.driftCheck.resources | nindent 16 }}
          containers:
            - name: recommend
              image: "{{ .Values.driftCheck.image.repository }}:{{ .Values.driftCheck.image.tag }}"
              command: ["python", "/app/recommend.py"]
              env:
                {{- include "platform-evidently.driftEnv" . | nindent 16 }}
                - { name: THRESHOLD, value: {{ .Values.driftCheck.threshold | quote }} }
                - { name: COOLDOWN, value: {{ .Values.driftCheck.cooldown | quote }} }
                - { name: AUTO_RETRAIN, value: {{ .Values.driftCheck.autoRetrain | quote }} }
                - { name: TRAINING_CRONJOB, value: {{ .Values.driftCheck.trainingCronJob | quote }} }
                - { name: DRIFT_EXPERIMENT, value: {{ .Values.driftCheck.experiment | quote }} }
                - name: POD_NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
              volumeMounts: *mounts
              resources:
                {{- toYaml .Values.driftCheck.resources | nindent 16 }}
          volumes:
            - name: scripts
              configMap:
                name: {{ include "platform-evidently.fullname" . }}-drift
            - name: work
              emptyDir: {}
{{- end }}
