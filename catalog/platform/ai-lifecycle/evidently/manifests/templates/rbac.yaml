# =============================================================================
# Least-privilege identity of the drift check: it may read the training
# CronJob and create Jobs from it (activation flow), nothing else.
# =============================================================================
{{- if .Values.driftCheck.autoRetrain }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform-evidently.fullname" . }}-drift
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-evidently.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "platform-evidently.fullname" . }}-drift
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-evidently.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: [{{ .Values.driftCheck.trainingCronJob | quote }}]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "platform-evidently.fullname" . }}-drift
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-evidently.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "platform-evidently.fullname" . }}-drift
subjects:
  - kind: ServiceAccount
    name: {{ include "platform-evidently.fullname" . }}-drift
    namespace: {{ .Release.Namespace }}
{{- end }}
