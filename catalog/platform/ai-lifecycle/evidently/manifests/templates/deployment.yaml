# =============================================================================
# Evidently UI (workspace of drift reports)
# ISO/IEC 42001: B.6.2.6.2
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-evidently.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-evidently.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "platform-evidently.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform-evidently.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: evidently-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image entrypoint is "evidently ui".
          args: ["--workspace", "/workspace", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: EVIDENTLY_DISABLE_TELEMETRY
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/version, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/version, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: workspace
          {{- if .Values.ui.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "platform-evidently.fullname" . }}-workspace
          {{- else }}
          emptyDir: {}
          {{- end }}
