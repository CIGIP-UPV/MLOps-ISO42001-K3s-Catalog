# =============================================================================
# Drift check scripts (files/extract.py, drift.py, recommend.py)
# ISO/IEC 42001: B.6.2.6.2, B.6.2.8.1, B.8.0.5.1
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-evidently.fullname" . }}-drift
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-evidently.labels" . | nindent 4 }}
data:
{{- range $f := list "extract.py" "drift.py" "recommend.py" }}
  {{ $f }}: |
{{ $.Files.Get (printf "files/%s" $f) | indent 4 }}
{{- end }}
