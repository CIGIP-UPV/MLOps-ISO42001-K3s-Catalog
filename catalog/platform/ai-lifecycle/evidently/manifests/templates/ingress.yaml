{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-evidently
  labels:
    {{- include "platform-evidently.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-evidently
                port:
                  name: http
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [ {{ .Values.ingress.host }} ]
      secretName: {{ .Release.Name }}-evidently-tls
  {{- end }}
{{- end }}
