# =============================================================================
# Evidently AI: Drift Monitoring and Retraining Recommendation
# Tier: Platform | RA Components: Model Technical Performance Monitoring
#                 (CMP-10, platform), Retraining Recommendation (CMP-14)
# ISO/IEC 42001: B.6.2.6.2, B.6.2.8.1, B.8.0.5.1
# Two parts:
#   * the Evidently UI, a workspace that keeps every drift report;
#   * a scheduled drift check that compares the recent platform data with
#     the training data of the served model version, records a retraining
#     recommendation and, above the threshold, starts the retraining job.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-evidently"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.2.6.2: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.8.1: "true"
  mlops-iso42001.cigip-upv.es/B.8.0.5.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-10: "true"
  mlops-iso42001.cigip-upv.es/CMP-14: "true"
# END iso42001-labels

# Evidently image (UI and drift report step). The code uses the 0.4.x API.
image:
  repository: evidently/evidently-service
  tag: "0.4.33"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: traefik
  host: evidently.platform.local
  tlsSecret: ""
  annotations: {}

ui:
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

driftCheck:
  enabled: true
  schedule: "*/30 * * * *"
  # Runtime of the extract and recommend steps (MLflow client, psycopg2,
  # Kubernetes client).
  image:
    repository: ghcr.io/burakince/mlflow
    tag: "2.22.1"
  mlflowTrackingUri: http://platform-mlflow.mlops.svc.cluster.local:5000
  experiment: zdm-drift-monitoring
  modelName: zdm-anomaly-detector
  alias: champion
  # Recent data compared with the training data of the served version.
  currentWindow: "1 hour"
  bucket: "10 seconds"
  minCurrentRows: 30
  # Retraining is recommended when this share of features drifts.
  threshold: 0.5
  # Start a retraining Job from the CronJob of platform-training-jobs.
  autoRetrain: true
  trainingCronJob: platform-training-jobs
  # No new retraining within this period after one was started.
  cooldown: "6 hours"
  # Platform data stock (reads sensor_readings, writes recommendations).
  dataStock:
    host: platform-timescaledb.platform.svc.cluster.local
    port: 5432
    database: zdm_platform
    user: ml
    existingSecret: platform-ml-db
    passwordKey: password
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

nodeSelector: {}
