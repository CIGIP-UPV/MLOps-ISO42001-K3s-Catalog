# =============================================================================
# Rancher Questions: Evidently AI (Drift Monitoring and Retraining Recommendation)
# ISO/IEC 42001: B.6.2.6.2, B.6.2.8.1, B.8.0.5.1
# =============================================================================
categories:
  - "Platform"
  - "AI Lifecycle"

questions:

  # ---- UI ----
  - variable: ui.persistence.size
    label: "UI Workspace Size"
    type: string
    default: "5Gi"
    group: "Evidently UI"

  - variable: ingress.enabled
    label: "Expose the UI through Ingress"
    type: boolean
    default: false
    group: "Evidently UI"

  - variable: ingress.host
    label: "UI Hostname"
    type: hostname
    default: "evidently.platform.local"
    show_if: "ingress.enabled=true"
    group: "Evidently UI"

  # ---- Drift check ----
  - variable: driftCheck.enabled
    label: "Enable Scheduled Drift Check"
    type: boolean
    default: true
    group: "Drift Check"

  - variable: driftCheck.schedule
    label: "Drift Check Schedule (cron)"
    type: string
    default: "*/30 * * * *"
    show_if: "driftCheck.enabled=true"
    group: "Drift Check"

  - variable: driftCheck.currentWindow
    label: "Window of Recent Data"
    type: string
    default: "1 hour"
    show_if: "driftCheck.enabled=true"
    group: "Drift Check"

  - variable: driftCheck.threshold
    label: "Retraining Threshold (share of drifted features)"
    type: string
    default: "0.5"
    show_if: "driftCheck.enabled=true"
    group: "Drift Check"

  # ---- Retraining ----
  - variable: driftCheck.autoRetrain
    label: "Start Retraining Automatically"
    description: "Creates a Job from the training CronJob when the threshold is reached"
    type: boolean
    default: true
    group: "Retraining Recommendation"

  - variable: driftCheck.trainingCronJob
    label: "Training CronJob"
    type: string
    default: "platform-training-jobs"
    show_if: "driftCheck.autoRetrain=true"
    group: "Retraining Recommendation"

  - variable: driftCheck.cooldown
    label: "Cooldown between Retrainings"
    type: string
    default: "6 hours"
    show_if: "driftCheck.autoRetrain=true"
    group: "Retraining Recommendation"

  # ---- Data ----
  - variable: driftCheck.dataStock.host
    label: "TimescaleDB Host"
    type: string
    default: "platform-timescaledb.platform.svc.cluster.local"
    group: "Data"

  - variable: driftCheck.dataStock.existingSecret
    label: "Credentials Secret (role ml)"
    type: string
    default: "platform-ml-db"
    group: "Data"
