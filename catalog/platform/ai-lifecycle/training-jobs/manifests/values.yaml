# =============================================================================
# Training Jobs: Model Training Pipeline (platform)
# Tier: Platform | RA Components: Model (CMP-04, platform), Retraining
#                 Recommendation (CMP-14, retraining execution)
# ISO/IEC 42001: B.6.2.6.4
# Trains on the consolidated data of the platform data stock (TimescaleDB),
# registers the model in MLflow with data provenance tags and, when the
# release criteria pass, moves the serving alias (propagated to the edge by
# edge-mlflow-sync). Code in files/train.py; public runtime image.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-training-jobs"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.2.6.4: "true"
  mlops-iso42001.cigip-upv.es/CMP-04: "true"
  mlops-iso42001.cigip-upv.es/CMP-14: "true"
# END iso42001-labels

image:
  repository: ghcr.io/burakince/mlflow
  tag: "2.22.1"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Nightly retraining; on-demand and drift-triggered runs reuse this template.
schedule: "0 2 * * *"
suspend: false
backoffLimit: 1
activeDeadlineSeconds: 3600
ttlSecondsAfterFinished: 86400
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

mlflow:
  trackingUri: http://platform-mlflow.mlops.svc.cluster.local:5000
  experiment: zdm-anomaly-detection
  modelName: zdm-anomaly-detector
  alias: champion
  # Move the alias to the new version when the release criteria pass.
  promote: true

training:
  trigger: schedule          # overridden to "drift" by platform-evidently
  window: "24 hours"         # training window over sensor_readings
  bucket: "10 seconds"       # time bucket of one feature vector
  contamination: 0.02        # expected anomaly share (IsolationForest)

# Release criteria (B.6.1.3.4): a version is only promoted if it passes.
releaseCriteria:
  minSamples: 200
  maxAnomalyRate: 0.10
  # Operator feedback as labels (feedback interface, CMP-12): with at least
  # minLabels labelled predictions, the candidate must agree with the
  # operators on at least minAgreement of them (0 = report only).
  feedback:
    minLabels: 20
    minAgreement: 0

# Platform data stock, read-only role "ml".
dataStock:
  host: platform-timescaledb.platform.svc.cluster.local
  port: 5432
  database: zdm_platform
  user: ml
  existingSecret: platform-ml-db
  passwordKey: password

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

nodeSelector: {}
