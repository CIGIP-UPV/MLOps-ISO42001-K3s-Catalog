# =============================================================================
# Rancher Questions: Training Jobs (Model Training Pipeline)
# ISO/IEC 42001: B.6.2.6.4
# =============================================================================
categories:
  - "Platform"
  - "AI Lifecycle"

questions:

  # ---- Schedule ----
  - variable: schedule
    label: "Retraining Schedule (cron)"
    type: string
    default: "0 2 * * *"
    group: "Schedule"

  - variable: suspend
    label: "Suspend Scheduled Retraining"
    description: "On-demand and drift-triggered runs still work"
    type: boolean
    default: false
    group: "Schedule"

  # ---- Registry ----
  - variable: mlflow.trackingUri
    label: "MLflow URL"
    type: string
    default: "http://platform-mlflow.mlops.svc.cluster.local:5000"
    group: "Model Registry"

  - variable: mlflow.modelName
    label: "Registered Model"
    type: string
    default: "zdm-anomaly-detector"
    group: "Model Registry"

  - variable: mlflow.alias
    label: "Serving Alias"
    description: "Moved to the new version when the release criteria pass"
    type: string
    default: "champion"
    group: "Model Registry"

  - variable: mlflow.promote
    label: "Promote Automatically"
    type: boolean
    default: true
    group: "Model Registry"

  # ---- Training ----
  - variable: training.window
    label: "Training Window"
    type: string
    default: "24 hours"
    group: "Training"

  - variable: training.bucket
    label: "Feature Time Bucket"
    type: string
    default: "10 seconds"
    group: "Training"

  - variable: training.contamination
    label: "Expected Anomaly Share"
    type: string
    default: "0.02"
    group: "Training"

  # ---- Release criteria ----
  - variable: releaseCriteria.minSamples
    label: "Minimum Training Samples"
    description: "ISO/IEC 42001: B.6.1.3.4 release criteria"
    type: int
    default: 200
    group: "Release Criteria"

  - variable: releaseCriteria.maxAnomalyRate
    label: "Maximum Anomaly Rate on Training Data"
    type: string
    default: "0.10"
    group: "Release Criteria"

  # ---- Data ----
  - variable: dataStock.host
    label: "TimescaleDB Host"
    type: string
    default: "platform-timescaledb.platform.svc.cluster.local"
    group: "Training Data"

  - variable: dataStock.existingSecret
    label: "Credentials Secret (role ml)"
    type: string
    default: "platform-ml-db"
    group: "Training Data"

  # ---- Resources ----
  - variable: resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "2Gi"
    group: "Resources"
