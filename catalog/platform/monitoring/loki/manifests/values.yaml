# =============================================================================
# Loki: Centralised Log Aggregation
# Helm chart: grafana/loki (single binary)
# Tier: Platform | RA Component: Logger (CMP-09: platform aggregation, and
#       enterprise-level Data role through the log archive in MinIO)
# ISO/IEC 42001: B.6.2.8.1
# Chunks and index are stored in the loki-logs bucket of platform-minio, so
# the audit trail outlives the Loki pod and its node (90-day retention).
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-loki"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.2.8.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-09: "true"
# END iso42001-labels

loki:
  commonLabels: *iso42001Labels

  deploymentMode: SingleBinary

  loki:
    auth_enabled: false               # single tenant
    commonConfig:
      replication_factor: 1

    # Object storage: platform MinIO. Credentials are expanded from the
    # environment (-config.expand-env=true), set from the Secret below.
    storage:
      type: s3
      bucketNames:
        chunks: loki-logs
        ruler: loki-logs
        admin: loki-logs
      s3:
        endpoint: platform-minio.minio.svc.cluster.local:9000
        region: us-east-1
        accessKeyId: ${LOKI_S3_ACCESS_KEY}
        secretAccessKey: ${LOKI_S3_SECRET_KEY}
        s3ForcePathStyle: true
        insecure: true

    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    # Retention: 90 days for ISO/IEC 42001 audit readiness (B.6.2.8.1)
    limits_config:
      retention_period: 2160h
      max_query_length: 721h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
    compactor:
      retention_enabled: true
      delete_request_store: s3

  singleBinary:
    replicas: 1
    podLabels: *iso42001Labels
    extraArgs:
      - -config.expand-env=true
    # Secret created by install.sh (keys LOKI_S3_ACCESS_KEY, LOKI_S3_SECRET_KEY)
    extraEnvFrom:
      - secretRef:
          name: platform-loki-s3
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi                      # WAL and local cache; data lives in MinIO
    resources:
      requests:
        cpu: "100m"
        memory: "384Mi"
      limits:
        cpu: "1000m"
        memory: "1536Mi"

  # Clients (Fluent Bit, Falcosidekick, Grafana) use platform-loki:3100
  # directly; the nginx gateway and the memcached caches are not needed at
  # this scale.
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  # No alerting rules are shipped, so the rules sidecar is not needed.
  sidecar:
    rules:
      enabled: false
  test:
    enabled: false

  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  monitoring:
    serviceMonitor:
      enabled: true
      labels: *iso42001Labels
