# =============================================================================
# Rancher Questions: Loki (Centralised Log Aggregation)
# ISO/IEC 42001: B.6.2.8.1
# Variables are prefixed with the subchart name (loki.).
# =============================================================================
categories:
  - "Platform"
  - "Monitoring"

questions:
  - variable: loki.loki.limits_config.retention_period
    label: "Log Retention"
    description: "90 days (2160h) or more for ISO/IEC 42001 audit readiness"
    type: string
    default: "2160h"
    group: "Retention"

  - variable: loki.loki.storage.s3.endpoint
    label: "S3 Endpoint (platform MinIO)"
    type: string
    default: "platform-minio.minio.svc.cluster.local:9000"
    group: "Object Storage"

  - variable: loki.loki.storage.bucketNames.chunks
    label: "Bucket"
    type: string
    default: "loki-logs"
    group: "Object Storage"

  - variable: loki.singleBinary.persistence.size
    label: "Local Volume (WAL and cache)"
    type: string
    default: "10Gi"
    group: "Storage"

  - variable: loki.singleBinary.persistence.storageClass
    label: "Storage Class"
    type: storageclass
    default: "local-path"
    group: "Storage"

  - variable: loki.singleBinary.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "1536Mi"
    group: "Resources"

  - variable: loki.monitoring.serviceMonitor.enabled
    label: "Create ServiceMonitor"
    type: boolean
    default: true
    group: "Monitoring"
