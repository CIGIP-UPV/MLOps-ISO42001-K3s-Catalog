# =============================================================================
# Grafana: Information Centre and monitoring dashboards
# Helm chart: grafana/grafana
# Tier: Platform | RA Components: Information Centre (CMP-06), Model
#       Technical Performance Monitoring (CMP-10), Goal-Oriented Monitoring
#       (CMP-11)
# ISO/IEC 42001: B.6.1.3.1, B.6.1.3.3, B.6.2.6.2
# Data sources are provisioned from this file; dashboards are loaded by the
# sidecar from every ConfigMap labelled grafana_dashboard=1 (the enterprise
# overlay and the Kubernetes dashboards of platform-prometheus).
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-grafana"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.1.3.1: "true"
  mlops-iso42001.cigip-upv.es/B.6.1.3.3: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.2: "true"
  mlops-iso42001.cigip-upv.es/CMP-06: "true"
  mlops-iso42001.cigip-upv.es/CMP-10: "true"
  mlops-iso42001.cigip-upv.es/CMP-11: "true"
# END iso42001-labels

grafana:
  extraLabels: *iso42001Labels

  # Admin credentials: Secret created by install.sh (keys admin-user,
  # admin-password).
  admin:
    existingSecret: platform-grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Data source passwords (TIMESCALEDB_PASSWORD, EDGEPG_PASSWORD) from a
  # Secret created by install.sh; referenced as $__env{...} below.
  envFromSecrets:
    - name: platform-grafana-datasources

  # The volume ownership is set by fsGroup (472); the chown init container
  # (busybox from Docker Hub) is not needed.
  initChownData:
    enabled: false

  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          url: http://platform-prometheus-prometheus.monitoring.svc.cluster.local:9090
          access: proxy
          isDefault: true
        - name: Loki
          uid: loki
          type: loki
          url: http://platform-loki.monitoring.svc.cluster.local:3100
          access: proxy
        - name: TimescaleDB
          uid: timescaledb
          type: grafana-postgresql-datasource
          url: platform-timescaledb.platform.svc.cluster.local:5432
          user: grafana
          jsonData:
            database: zdm_platform
            sslmode: disable
            postgresVersion: 1600
            timescaledb: true
          secureJsonData:
            password: $__env{TIMESCALEDB_PASSWORD}
        - name: Edge PostgreSQL
          uid: edgepg
          type: grafana-postgresql-datasource
          url: edge-postgresql.edge.svc.cluster.local:5432
          user: edge_app
          jsonData:
            database: zdm_edge
            sslmode: disable
            postgresVersion: 1600
          secureJsonData:
            password: $__env{EDGEPG_PASSWORD}

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"
    analytics:
      reporting_enabled: false
      check_for_updates: false
    users:
      allow_sign_up: false
    # Keycloak OIDC (B.6.1.3.1): enable after enterprise-keycloak is
    # installed; the client secret is read from the environment
    # (GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET in platform-grafana-datasources).
    auth.generic_oauth:
      enabled: false
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      scopes: openid profile email
      auth_url: http://enterprise-keycloak.security.svc.cluster.local/realms/ai-system/protocol/openid-connect/auth
      token_url: http://enterprise-keycloak.security.svc.cluster.local/realms/ai-system/protocol/openid-connect/token
      api_url: http://enterprise-keycloak.security.svc.cluster.local/realms/ai-system/protocol/openid-connect/userinfo
      role_attribute_path: "contains(groups[*], 'admin') && 'Admin' || contains(groups[*], 'data-scientist') && 'Editor' || 'Viewer'"

  ingress:
    enabled: false

  serviceMonitor:
    enabled: true

  testFramework:
    enabled: false

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
