# =============================================================================
# Rancher Questions: Grafana (Information Centre)
# ISO/IEC 42001: B.6.1.3.1, B.6.1.3.3, B.6.2.6.2
# Variables are prefixed with the subchart name (grafana.).
# =============================================================================
categories:
  - "Platform"
  - "Monitoring"

questions:
  - variable: grafana.admin.existingSecret
    label: "Admin Credentials Secret"
    description: "Keys admin-user and admin-password (created by install.sh)"
    type: string
    default: "platform-grafana-admin"
    group: "Authentication"

  - variable: grafana.grafana\.ini.auth\.generic_oauth.enabled
    label: "Keycloak Single Sign-On"
    description: "Requires enterprise-keycloak (ISO/IEC 42001: B.6.1.3.1)"
    type: boolean
    default: false
    group: "Authentication"

  - variable: grafana.persistence.size
    label: "Volume Size"
    type: string
    default: "2Gi"
    group: "Storage"

  - variable: grafana.sidecar.dashboards.searchNamespace
    label: "Namespaces Searched for Dashboards"
    type: string
    default: "ALL"
    group: "Dashboards"

  - variable: grafana.ingress.enabled
    label: "Enable Ingress"
    type: boolean
    default: false
    group: "Networking"

  - variable: grafana.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "512Mi"
    group: "Resources"
