# =============================================================================
# Rancher Questions: Prometheus + Alertmanager (kube-prometheus-stack)
# ISO/IEC 42001: B.6.1.2.2, B.6.2.6.2, B.8.0.5.1
# Variables are prefixed with the subchart name (kube-prometheus-stack.).
# =============================================================================
categories:
  - "Platform"
  - "Monitoring"

questions:
  - variable: kube-prometheus-stack.prometheus.prometheusSpec.retention
    label: "Metrics Retention"
    type: string
    default: "15d"
    group: "Prometheus"

  - variable: kube-prometheus-stack.prometheus.prometheusSpec.retentionSize
    label: "Maximum TSDB Size"
    type: string
    default: "18GB"
    group: "Prometheus"

  - variable: kube-prometheus-stack.prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage
    label: "Prometheus Volume Size"
    type: string
    default: "20Gi"
    group: "Prometheus"

  - variable: kube-prometheus-stack.prometheus.prometheusSpec.enableRemoteWriteReceiver
    label: "Accept Remote-Write from Edge Agents"
    type: boolean
    default: true
    group: "Prometheus"

  - variable: kube-prometheus-stack.prometheus.prometheusSpec.resources.limits.memory
    label: "Prometheus Memory Limit"
    type: string
    default: "3Gi"
    group: "Resources"

  - variable: kube-prometheus-stack.alertmanager.enabled
    label: "Enable Alertmanager"
    description: "ISO/IEC 42001: B.8.0.5.1"
    type: boolean
    default: true
    group: "Alerting"

  - variable: kube-prometheus-stack.prometheus.ingress.enabled
    label: "Expose Prometheus through Ingress"
    type: boolean
    default: false
    group: "Networking"
