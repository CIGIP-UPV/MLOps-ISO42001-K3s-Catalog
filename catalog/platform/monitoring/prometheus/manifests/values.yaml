# =============================================================================
# Prometheus + Alertmanager (kube-prometheus-stack)
# Helm chart: prometheus-community/kube-prometheus-stack
# Tier: Platform | RA Components: Infrastructure Technical Monitoring
#       (CMP-08), Model Technical Performance Monitoring (CMP-10),
#       Goal-Oriented Monitoring (CMP-11)
# ISO/IEC 42001: B.6.1.2.2, B.6.2.6.2, B.8.0.5.1
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "platform-prometheus"
  mlops-iso42001.cigip-upv.es/tier: "platform"
  mlops-iso42001.cigip-upv.es/B.6.1.2.2: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.2: "true"
  mlops-iso42001.cigip-upv.es/B.8.0.5.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-08: "true"
  mlops-iso42001.cigip-upv.es/CMP-10: "true"
  mlops-iso42001.cigip-upv.es/CMP-11: "true"
# END iso42001-labels

kube-prometheus-stack:
  # Service names: platform-prometheus-prometheus, -alertmanager, -operator.
  fullnameOverride: platform-prometheus
  commonLabels: *iso42001Labels

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    prometheusSpec:
      podMetadata:
        labels: *iso42001Labels
      replicas: 1
      retention: 15d
      retentionSize: "18GB"
      # Receives the samples of the edge Prometheus Agents (remote-write).
      enableRemoteWriteReceiver: true
      # Select the ServiceMonitors, PodMonitors and rules of every catalog
      # chart, not only those carrying this release's label.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      resources:
        requests:
          cpu: "200m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "3Gi"
    ingress:
      enabled: false

  # ---------------------------------------------------------------------------
  # Alertmanager (B.8.0.5.1). Alerts are grouped and kept by Alertmanager and
  # shown in Grafana. Zammad offers no endpoint for the Alertmanager webhook
  # format: route critical alerts to the helpdesk through its e-mail channel
  # (email_configs) or an adapter that calls the Zammad ticket API.
  # ---------------------------------------------------------------------------
  alertmanager:
    enabled: true
    alertmanagerSpec:
      podMetadata:
        labels: *iso42001Labels
      replicas: 1
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi
      resources:
        requests:
          cpu: "20m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ["alertname", "tier"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: "null"
        routes:
          - matchers: ['severity =~ "warning|critical"', 'component = "ai-system"']
            receiver: ai-system
      receivers:
        - name: "null"
        - name: ai-system
    ingress:
      enabled: false

  # Grafana is deployed by platform-grafana; the Kubernetes dashboards of
  # this stack are still rendered as ConfigMaps for its sidecar (CMP-08).
  grafana:
    enabled: false
    forceDeployDashboards: true
    defaultDashboardsTimezone: browser

  # K3s embeds the controller manager, scheduler, proxy and etcd in the k3s
  # process; their endpoints are not scrapable and would fire TargetDown.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  prometheusOperator:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  prometheus-node-exporter:
    podLabels: *iso42001Labels
  kube-state-metrics:
    customLabels: *iso42001Labels

  # ---------------------------------------------------------------------------
  # Alert rules on the metrics that the catalog actually exposes
  # ---------------------------------------------------------------------------
  additionalPrometheusRulesMap:
    ai-system-rules:
      groups:
        - name: ai.model.performance       # CMP-10, B.6.2.6.2
          rules:
            - alert: ModelNotLoaded
              expr: max by (namespace, pod) (model_loaded) == 0
              for: 15m
              labels: { severity: warning, component: ai-system, tier: edge }
              annotations:
                summary: "Edge model server has no model loaded"
                description: "No promoted model version has been synchronised to {{ $labels.pod }} for 15 minutes."
            - alert: ModelInferenceLatencyHigh
              expr: histogram_quantile(0.95, sum by (le, model_version) (rate(model_prediction_latency_seconds_bucket[5m]))) > 0.5
              for: 10m
              labels: { severity: warning, component: ai-system, tier: edge }
              annotations:
                summary: "Model inference p95 latency above 500 ms"
                description: "p95 latency of model version {{ $labels.model_version }} is {{ $value }} s."
            - alert: ModelAnomalyRateHigh
              expr: |
                sum(rate(model_predictions_total{outcome="anomaly"}[15m]))
                  / sum(rate(model_predictions_total{outcome=~"normal|anomaly"}[15m])) > 0.2
              for: 15m
              labels: { severity: critical, component: ai-system, tier: edge }
              annotations:
                summary: "More than 20% of the predictions are anomalies"
                description: "Possible process deviation or model degradation; check the drift report and the plant."
            - alert: PredictionLogFailing
              expr: increase(model_prediction_log_errors_total[15m]) > 0
              labels: { severity: warning, component: ai-system, tier: edge }
              annotations:
                summary: "Predictions are not being written to the edge data stock"
        - name: ai.input.data              # CMP-01
          rules:
            - alert: IngestionStalled
              expr: time() - max(ingest_last_sample_timestamp_seconds) > 300
              for: 5m
              labels: { severity: critical, component: ai-system, tier: edge }
              annotations:
                summary: "No valid plant data ingested for more than 5 minutes"
            - alert: IngestionRejectionRateHigh
              expr: |
                sum(rate(ingest_messages_rejected_total[10m]))
                  / (sum(rate(ingest_messages_rejected_total[10m])) + sum(rate(ingest_messages_valid_total[10m]))) > 0.1
              for: 10m
              labels: { severity: warning, component: ai-system, tier: edge }
              annotations:
                summary: "More than 10% of the incoming samples are rejected"
            - alert: OpcUaGatewayReadErrors
              expr: increase(internal_gather_errors{input="opcua"}[10m]) > 0
              labels: { severity: warning, component: ai-system, tier: edge }
              annotations:
                summary: "The OPC UA gateway cannot read one or more endpoints"
        - name: ai.infrastructure          # CMP-08
          rules:
            - alert: AIContainerThrottled
              expr: |
                sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total{container=~"fastapi-model|train|sync"}[5m]))
                  / sum by (namespace, pod) (rate(container_cpu_cfs_periods_total{container=~"fastapi-model|train|sync"}[5m])) > 0.25
              for: 10m
              labels: { severity: warning, component: ai-system }
              annotations:
                summary: "AI container throttled more than 25% of the time"
