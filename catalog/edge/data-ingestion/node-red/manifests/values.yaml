# =============================================================================
# Node-RED: Edge Input Data Monitoring and Ingestion
# Helm chart: schwarzit/node-red (community)
# Tier: Edge | RA Component: Input Data Monitoring (CMP-01)
# ISO/IEC 42001: B.6.2.6.4
# The ingestion flow (files/flows.json) subscribes to the OPC UA samples
# published by edge-opc-ua-gateway, validates them and writes the valid ones
# to the edge data stock; rejected samples go to plant/<machine>/rejected and
# the counters are exposed on /metrics.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-node-red"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.2.6.4: "true"
  mlops-iso42001.cigip-upv.es/CMP-01: "true"
# END iso42001-labels

node-red:
  podLabels: *iso42001Labels

  image:
    registry: docker.io
    repository: nodered/node-red
    tag: "3.1.3"

  # Persistent /data: installed nodes and runtime context.
  persistence:
    enabled: true
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi

  # settings.js from the wrapper ConfigMap <release>-settings.
  settings:
    name: settings
    configMapName: edge-node-red-settings

  extraVolumes:
    - name: chart-files
      configMap:
        name: edge-node-red-flows

  # Installs the pinned extra nodes, copies the declarative flows and writes
  # the credentials from Secrets before Node-RED starts. Installing nodes
  # needs egress to the npm registry (allowed for this pod by the edge
  # NetworkPolicy); mirror the registry for air-gapped sites.
  initContainers:
    - name: prepare
      image: docker.io/nodered/node-red:3.1.3
      command: ["sh", "/chart/prepare.sh"]
      # Same user as the node-red container, which must read the 0600
      # credential files written here.
      securityContext:
        runAsUser: 10003
        runAsGroup: 10003
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
      env:
        - name: EXTRA_NODES
          value: "node-red-contrib-postgresql@0.16.2"
        - name: MQTT_USERNAME
          value: nodered
        - name: MQTT_PASSWORD
          valueFrom:
            secretKeyRef: { name: edge-mosquitto-users, key: nodered }
        - name: NODE_RED_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef: { name: edge-node-red-admin, key: password, optional: true }
      volumeMounts:
        - name: data
          mountPath: /data
        - name: chart-files
          mountPath: /chart
          readOnly: true

  env:
    - name: TZ
      value: "Europe/Madrid"
    - name: MQTT_HOST
      value: edge-mosquitto.edge.svc.cluster.local
    - name: MQTT_PORT
      value: "1883"
    - name: MQTT_TOPIC
      value: "plant/+/opcua"
    - name: INPUT_MAX_ABS
      value: "1000000"
    - name: INPUT_MAX_AGE_S
      value: "86400"
    - name: PGHOST
      value: edge-postgresql.edge.svc.cluster.local
    - name: PGPORT
      value: "5432"
    - name: PGDATABASE
      value: zdm_edge
    - name: PGUSER
      value: edge_app
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef: { name: edge-postgresql-auth, key: password }

  # The editor is only reachable inside the cluster (port-forward); enable
  # the Ingress together with TLS and the admin password Secret.
  ingress:
    enabled: false

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "1880"
    prometheus.io/path: "/metrics"

  resources:
    requests:
      cpu: "100m"
      memory: "192Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

  nodeSelector:
    node-role.kubernetes.io/edge: "true"

  livenessProbe:
    httpGet:
      path: /metrics
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /metrics
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
