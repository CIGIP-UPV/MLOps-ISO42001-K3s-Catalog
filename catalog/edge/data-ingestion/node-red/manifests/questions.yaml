# =============================================================================
# Rancher Questions: Node-RED (Edge Input Data Monitoring and Ingestion)
# ISO/IEC 42001: B.6.2.6.4
# Variables are prefixed with the subchart name (node-red.).
# =============================================================================
categories:
  - "Edge"
  - "Data Ingestion"

questions:

  - variable: node-red.image.tag
    label: "Node-RED Image Tag"
    type: string
    default: "3.1.3"
    group: "General"

  - variable: node-red.persistence.size
    label: "Data Volume Size"
    type: string
    default: "1Gi"
    group: "Storage"

  - variable: node-red.persistence.storageClass
    label: "Storage Class"
    type: storageclass
    default: "local-path"
    group: "Storage"

  - variable: node-red.ingress.enabled
    label: "Expose the Editor through Ingress"
    description: "Enable only with TLS and the edge-node-red-admin password Secret"
    type: boolean
    default: false
    group: "Networking"

  - variable: node-red.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "512Mi"
    group: "Resources"

  - variable: node-red.resources.requests.cpu
    label: "CPU Request"
    type: string
    default: "100m"
    group: "Resources"

  - variable: node-red.nodeSelector.node-role\.kubernetes\.io/edge
    label: "Pin to Edge Nodes"
    type: string
    default: "true"
    group: "Scheduling"
