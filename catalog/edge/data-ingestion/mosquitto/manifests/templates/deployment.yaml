# =============================================================================
# Eclipse Mosquitto Deployment
# Tier: Edge | RA Component: Input Data Monitoring (CMP-01)
# ISO/IEC 42001: B.6.1.3.1, B.6.2.6.4
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-mosquitto.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-mosquitto.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "edge-mosquitto.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "edge-mosquitto.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Builds the hashed password file from the plain credentials Secret
      # (one key per MQTT user) with mosquitto_passwd; nothing is hashed or
      # stored in the chart itself.
      initContainers:
        - name: passwords
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              umask 077
              : > /work/passwords.txt
              for f in /users/*; do
                mosquitto_passwd -b /work/passwords.txt "$(basename "$f")" "$(cat "$f")"
              done
              # The broker opens the file after dropping to the mosquitto
              # user (uid 1883), so it must own it.
              chown 1883:1883 /work/passwords.txt
              chmod 0600 /work/passwords.txt
          volumeMounts:
            - name: users
              mountPath: /users
              readOnly: true
            - name: passwords
              mountPath: /work
      containers:
        - name: mosquitto
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: mqtt
              containerPort: {{ .Values.config.mqttPort }}
              protocol: TCP
            {{- if .Values.config.websocketEnabled }}
            - name: websocket
              containerPort: {{ .Values.config.websocketPort }}
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: passwords
              mountPath: /mosquitto/config/passwords.txt
              subPath: passwords.txt
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /mosquitto/data
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "edge-mosquitto.fullname" . }}-config
        - name: users
          secret:
            secretName: {{ .Values.auth.usersSecret }}
        - name: passwords
          emptyDir:
            medium: Memory
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "edge-mosquitto.fullname" . }}-data
        {{- end }}
