# =============================================================================
# Eclipse Mosquitto: MQTT Broker (Edge)
# Helm Chart Values
# Tier: Edge | RA Component: Input Data Monitoring (CMP-01)
# ISO/IEC 42001: B.6.1.3.1, B.6.2.6.4
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-mosquitto"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.1.3.1: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.4: "true"
  mlops-iso42001.cigip-upv.es/CMP-01: "true"
# END iso42001-labels

replicaCount: 1

image:
  repository: public.ecr.aws/docker/library/eclipse-mosquitto   # Docker official image, public ECR mirror
  pullPolicy: IfNotPresent
  tag: "2.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "false"

podSecurityContext:
  fsGroup: 1883

securityContext: {}

# Mosquitto configuration
config:
  mqttPort: 1883
  websocketEnabled: true
  websocketPort: 9001
  allowAnonymous: false
  messageSizeLimit: 1048576
  persistence: true
  persistenceLocation: /mosquitto/data/
  logDest: stdout
  logType: all
  connectionMessages: true

# Authentication: Secret with one key per MQTT user and the plain password
# as value (created by install.sh with the users gateway and nodered). An
# init container hashes them with mosquitto_passwd at start-up.
auth:
  usersSecret: edge-mosquitto-users

service:
  type: ClusterIP
  annotations: {}
  ports:
    mqtt: 1883
    websocket: 9001

# Optional Ingress (disabled by default)
ingress:
  enabled: false
  className: traefik
  annotations: {}
  hostname: mosquitto.edge.local
  tls: []

persistence:
  enabled: true
  storageClass: local-path
  size: 1Gi

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Node selector for edge nodes
nodeSelector:
  node-role.kubernetes.io/edge: "true"

tolerations: []

affinity: {}

# Probes configuration
livenessProbe:
  tcpSocket:
    port: 1883
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  tcpSocket:
    port: 1883
  initialDelaySeconds: 5
  periodSeconds: 10
