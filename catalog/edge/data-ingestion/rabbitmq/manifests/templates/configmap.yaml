# =============================================================================
# RabbitMQ Configuration
# ISO/IEC 42001: B.6.2.6.4
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge-rabbitmq.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-rabbitmq.labels" . | nindent 4 }}
data:
  enabled_plugins: |
    [rabbitmq_management{{ if .Values.config.metricsEnabled }},rabbitmq_prometheus{{ end }}{{ if .Values.config.mqttEnabled }},rabbitmq_mqtt{{ end }}].
  rabbitmq.conf: |
    # Listeners
    listeners.tcp.default = {{ .Values.config.amqpPort }}
    {{- if .Values.config.managementEnabled }}
    management.tcp.port = {{ .Values.config.managementPort }}
    {{- end }}
    {{- if .Values.config.metricsEnabled }}
    prometheus.tcp.port = {{ .Values.config.metricsPort }}
    {{- end }}
    {{- if .Values.config.mqttEnabled }}
    mqtt.listeners.tcp.default = {{ .Values.config.mqttPort }}
    mqtt.allow_anonymous = false
    {{- end }}

    # Default virtual host
    default_vhost = {{ .Values.config.defaultVhost }}

    # Store-and-forward buffering: apply back-pressure before the disk fills,
    # so the broker can buffer messages during upstream connectivity loss.
    disk_free_limit.absolute = {{ .Values.config.diskFreeLimit }}

    # Logging to stdout for Fluent Bit / Loki collection (B.6.2.8.1)
    log.console = true
    log.console.level = info
    log.file = false
