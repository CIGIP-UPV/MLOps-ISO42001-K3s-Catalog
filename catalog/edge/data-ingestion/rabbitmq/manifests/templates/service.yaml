# =============================================================================
# RabbitMQ Service
# ISO/IEC 42001: B.6.2.6.4
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-rabbitmq.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-rabbitmq.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: amqp
      port: {{ .Values.service.ports.amqp }}
      targetPort: amqp
      protocol: TCP
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePorts.amqp }}
      {{- end }}
    {{- if .Values.config.managementEnabled }}
    - name: management
      port: {{ .Values.service.ports.management }}
      targetPort: management
      protocol: TCP
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePorts.management }}
      {{- end }}
    {{- end }}
    {{- if .Values.config.metricsEnabled }}
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
    {{- if .Values.config.mqttEnabled }}
    - name: mqtt
      port: {{ .Values.service.ports.mqtt }}
      targetPort: mqtt
      protocol: TCP
    {{- end }}
  selector:
    {{- include "edge-rabbitmq.selectorLabels" . | nindent 4 }}
