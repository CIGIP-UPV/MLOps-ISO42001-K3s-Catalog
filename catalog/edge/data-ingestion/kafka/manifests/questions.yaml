# =============================================================================
# Rancher Questions: Kafka (Edge Event Streaming)
# ISO/IEC 42001: B.6.2.6.4, B.6.2.8.1
# Variables are prefixed with the subchart name (kafka.) so that Rancher
# passes them to the wrapped bitnami/kafka chart.
# =============================================================================
categories:
  - "Edge"
  - "Data Ingestion"

questions:

  # ---- Architecture ----
  - variable: kafka.controller.replicaCount
    label: "KRaft Nodes (controller + broker)"
    description: "1 for an edge site; 3 for high availability"
    type: int
    default: 1
    min: 1
    max: 5
    group: "Architecture"

  - variable: kafka.broker.replicaCount
    label: "Additional Broker-only Nodes"
    description: "0 at the edge: the KRaft nodes also act as brokers"
    type: int
    default: 0
    min: 0
    max: 5
    group: "Architecture"

  # ---- Networking ----
  - variable: kafka.service.type
    label: "Service Type"
    type: enum
    default: "ClusterIP"
    options:
      - "ClusterIP"
      - "NodePort"
      - "LoadBalancer"
    group: "Networking"

  - variable: kafka.service.ports.client
    label: "Client Port"
    type: int
    default: 9092
    group: "Networking"

  # ---- Persistence ----
  - variable: kafka.controller.persistence.storageClass
    label: "Storage Class"
    type: storageclass
    default: "local-path"
    group: "Storage"

  - variable: kafka.controller.persistence.size
    label: "Volume Size"
    type: string
    default: "10Gi"
    group: "Storage"

  # ---- Data Retention ----
  - variable: kafka.extraConfig
    label: "Broker Configuration (retention)"
    description: "server.properties lines; edge storage is limited, so keep retention short"
    type: multiline
    default: |
      log.retention.hours=168
      log.retention.bytes=5368709120
      auto.create.topics.enable=true
      offsets.topic.replication.factor=1
      transaction.state.log.replication.factor=1
      transaction.state.log.min.isr=1
    group: "Data Retention"

  # ---- Security ----
  - variable: kafka.listeners.client.protocol
    label: "Client Listener Protocol"
    description: "Use SASL_SSL in production environments"
    type: enum
    default: "PLAINTEXT"
    options:
      - "PLAINTEXT"
      - "SASL_PLAINTEXT"
      - "SSL"
      - "SASL_SSL"
    group: "Security"

  # ---- Monitoring ----
  - variable: kafka.metrics.jmx.enabled
    label: "Enable JMX Metrics"
    description: "Expose Kafka metrics for Prometheus (ISO/IEC 42001: B.6.1.2.2)"
    type: boolean
    default: true
    group: "Monitoring"

  - variable: kafka.metrics.serviceMonitor.enabled
    label: "Enable Prometheus ServiceMonitor"
    description: "Requires the Prometheus Operator CRDs (platform-prometheus)"
    type: boolean
    default: false
    group: "Monitoring"

  # ---- Resources ----
  - variable: kafka.controller.resources.requests.cpu
    label: "CPU Request"
    type: string
    default: "250m"
    group: "Resources"

  - variable: kafka.controller.resources.requests.memory
    label: "Memory Request"
    type: string
    default: "768Mi"
    group: "Resources"

  - variable: kafka.controller.resources.limits.cpu
    label: "CPU Limit"
    type: string
    default: "1000m"
    group: "Resources"

  - variable: kafka.controller.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "1536Mi"
    group: "Resources"

  # ---- Scheduling ----
  - variable: kafka.controller.nodeSelector.node-role\.kubernetes\.io/edge
    label: "Pin to Edge Nodes"
    type: string
    default: "true"
    group: "Scheduling"
