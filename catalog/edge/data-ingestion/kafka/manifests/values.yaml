# =============================================================================
# Apache Kafka: Edge Event Streaming
# Helm chart: bitnami/kafka (KRaft mode)
# Tier: Edge | RA Component: Input Data Monitoring (CMP-01)
# ISO/IEC 42001: B.6.2.6.4, B.6.2.8.1
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-kafka"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.2.6.4: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.8.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-01: "true"
# END iso42001-labels

kafka:
  # Traceability labels on every object the subchart renders (pods included).
  commonLabels: *iso42001Labels

  # ---------------------------------------------------------------------------
  # Images: Bitnami moved its versioned images from docker.io/bitnami to
  # docker.io/bitnamilegacy in 2025. The legacy repository is frozen (no new
  # security patches); replace it with a maintained image for production.
  # ---------------------------------------------------------------------------
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: 3.8.1-debian-12-r0

  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell

  # ---------------------------------------------------------------------------
  # KRaft mode (no ZooKeeper). One combined controller + broker node is
  # enough for an edge site; raise controller.replicaCount to 3 for HA.
  # ---------------------------------------------------------------------------
  kraft:
    enabled: true

  # Clients inside the edge namespace connect without SASL; the edge
  # NetworkPolicy restricts who can reach the broker. Use SASL_SSL in
  # production.
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT

  # Broker configuration (retention is limited by edge storage).
  extraConfig: |
    log.retention.hours=168
    log.retention.bytes=5368709120
    auto.create.topics.enable=true
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1

  controller:
    replicaCount: 1
    controllerOnly: false
    heapOpts: -Xmx512m -Xms512m
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi
    resources:
      requests:
        cpu: "250m"
        memory: "768Mi"
      limits:
        cpu: "1000m"
        memory: "1536Mi"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "5556"
    nodeSelector:
      node-role.kubernetes.io/edge: "true"

  broker:
    replicaCount: 0              # the controller node also acts as broker

  # ---------------------------------------------------------------------------
  # Topics of the reference architecture
  # ---------------------------------------------------------------------------
  provisioning:
    enabled: true
    numPartitions: 1
    replicationFactor: 1
    topics:
      - name: sensor-raw
        partitions: 3
        replicationFactor: 1
        config:
          retention.ms: "604800000"    # 7 days
      - name: sensor-validated
        partitions: 3
        replicationFactor: 1
      - name: predictions
        partitions: 3
        replicationFactor: 1
      - name: alerts
        partitions: 1
        replicationFactor: 1
    nodeSelector:
      node-role.kubernetes.io/edge: "true"

  # ---------------------------------------------------------------------------
  # Metrics: JMX exporter scraped by the edge Prometheus Agent (B.6.1.2.2).
  # The ServiceMonitor is off so the chart does not require the Prometheus
  # Operator CRDs on an edge-only cluster.
  # ---------------------------------------------------------------------------
  metrics:
    jmx:
      enabled: true
      image:
        registry: docker.io
        repository: bitnamilegacy/jmx-exporter
    serviceMonitor:
      enabled: false
