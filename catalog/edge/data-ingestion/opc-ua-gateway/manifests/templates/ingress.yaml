{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-opcua-gateway
  labels:
    {{- include "edge-opc-ua-gateway.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-opcua-gateway
                port:
                  name: web
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [ {{ .Values.ingress.host }} ]
      secretName: {{ .Release.Name }}-opcua-tls
  {{- end }}
{{- end }}
