# =============================================================================
# OPC UA Gateway metrics Service (Telegraf prometheus_client output)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-opc-ua-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-opc-ua-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9273
      targetPort: metrics
  selector:
    {{- include "edge-opc-ua-gateway.selectorLabels" . | nindent 4 }}
