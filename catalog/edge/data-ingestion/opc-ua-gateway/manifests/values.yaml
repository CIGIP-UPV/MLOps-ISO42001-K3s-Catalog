# =============================================================================
# OPC UA Gateway: Industrial Protocol Bridge (edge)
# Image: Telegraf (MIT), inputs.opcua -> outputs.mqtt / outputs.kafka
# Tier: Edge | RA Component: Input Data Monitoring (CMP-01),
#             Industrial Protocol Gateway subcomponent
# ISO/IEC 42001: B.6.1.3.1, B.6.2.6.4
# The open-source edition of EMQX Neuron used before ships no OPC UA driver
# (only Modbus, MQTT, eKuiper, file, restful and monitor), so it could not
# read OPC UA endpoints. Telegraf's opcua input is open source.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-opc-ua-gateway"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.1.3.1: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.4: "true"
  mlops-iso42001.cigip-upv.es/CMP-01: "true"
# END iso42001-labels

image:
  repository: telegraf     # Docker official image (also mirrored at public.ecr.aws/docker/library)
  tag: "1.32-alpine"
  pullPolicy: IfNotPresent

# Stored as the site_id tag of every sample.
siteId: "edge-site-01"

debug: false

opcua:
  # Sampling period of every endpoint.
  interval: "1s"
  # Timestamp of each sample: gather | server | source
  timestamp: "source"
  # Endpoints to read. The default targets the OPC PLC simulator used in the
  # laboratory (mcr.microsoft.com/iotedge/opc-plc); override per site.
  endpoints:
    - name: opc-plc-simulator
      url: opc.tcp://opc-plc.edge.svc.cluster.local:50000
      machineId: cnc-01
      # Security: None | Basic256Sha256 ... ; mode: None | Sign | SignAndEncrypt
      securityPolicy: "None"
      securityMode: "None"
      # Anonymous | UserName | Certificate. With UserName, existingSecret must
      # hold the keys username and password.
      authMethod: "Anonymous"
      existingSecret: ""
      nodes:
        - { name: SpikeData, namespace: "3", identifierType: s, identifier: SpikeData }
        - { name: DipData, namespace: "3", identifierType: s, identifier: DipData }
        - { name: PositiveTrendData, namespace: "3", identifierType: s, identifier: PositiveTrendData }
        - { name: NegativeTrendData, namespace: "3", identifierType: s, identifier: NegativeTrendData }

downstream:
  mqtt:
    enabled: true
    host: edge-mosquitto.edge.svc.cluster.local
    port: 1883
    topicPrefix: plant
    qos: 1
    # MQTT user of the gateway; its password is the key of the same name in
    # the Secret created by install.sh.
    username: gateway
    existingSecret: edge-mosquitto-users
  kafka:
    enabled: false
    brokers:
      - edge-kafka.edge.svc.cluster.local:9092
    topic: sensor-raw

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

nodeSelector:
  node-role.kubernetes.io/edge: "true"
tolerations: []
