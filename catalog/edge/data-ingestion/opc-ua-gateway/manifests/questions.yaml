# =============================================================================
# Rancher Questions: OPC-UA Gateway (Telegraf)
# ISO/IEC 42001: B.6.1.3.1, B.6.2.6.4
# Additional endpoints and nodes are declared in values.yaml.
# =============================================================================
categories:
  - "Edge"
  - "Data Ingestion"

questions:
  - variable: image.tag
    label: "Telegraf Image Tag"
    type: string
    default: "1.32-alpine"
    group: "General"

  - variable: siteId
    label: "Site Identifier"
    type: string
    default: "edge-site-01"
    group: "General"

  - variable: opcua.interval
    label: "Sampling Interval"
    type: string
    default: "1s"
    group: "OPC UA"

  - variable: opcua.endpoints[0].url
    label: "OPC UA Endpoint URL"
    type: string
    default: "opc.tcp://opc-plc.edge.svc.cluster.local:50000"
    group: "OPC UA"

  - variable: opcua.endpoints[0].machineId
    label: "Machine Identifier"
    type: string
    default: "cnc-01"
    group: "OPC UA"

  - variable: opcua.endpoints[0].securityPolicy
    label: "Security Policy"
    type: enum
    default: "None"
    options: ["None", "Basic128Rsa15", "Basic256", "Basic256Sha256", "auto"]
    group: "OPC UA"

  - variable: opcua.endpoints[0].securityMode
    label: "Security Mode"
    type: enum
    default: "None"
    options: ["None", "Sign", "SignAndEncrypt", "auto"]
    group: "OPC UA"

  - variable: opcua.endpoints[0].authMethod
    label: "Authentication"
    description: "UserName reads the keys username and password of the endpoint Secret"
    type: enum
    default: "Anonymous"
    options: ["Anonymous", "UserName", "Certificate"]
    group: "OPC UA"

  - variable: downstream.mqtt.enabled
    label: "Publish to MQTT"
    type: boolean
    default: true
    group: "Downstream"

  - variable: downstream.mqtt.host
    label: "MQTT Broker Host"
    type: string
    default: "edge-mosquitto.edge.svc.cluster.local"
    show_if: "downstream.mqtt.enabled=true"
    group: "Downstream"

  - variable: downstream.mqtt.topicPrefix
    label: "MQTT Topic Prefix"
    type: string
    default: "plant"
    show_if: "downstream.mqtt.enabled=true"
    group: "Downstream"

  - variable: downstream.kafka.enabled
    label: "Publish to Kafka"
    type: boolean
    default: false
    group: "Downstream"
