# =============================================================================
# Rancher Questions: FastAPI Model Server (Edge AI Inference)
# ISO/IEC 42001: B.6.2.6.2, B.6.2.6.4
# =============================================================================
categories:
  - "Edge"
  - "AI Inference"

questions:

  # ---- Container image ----
  - variable: image.repository
    label: "Runtime Image"
    description: "Must provide MLflow, FastAPI, uvicorn, prometheus_client and psycopg2"
    type: string
    default: "ghcr.io/burakince/mlflow"
    group: "Container Image"

  - variable: image.tag
    label: "Runtime Image Tag"
    description: "Keep aligned with the MLflow version of platform-mlflow"
    type: string
    default: "2.22.1"
    group: "Container Image"

  # ---- Model ----
  - variable: model.dir
    label: "Model Store Path"
    description: "Written by edge-mlflow-sync (current.json and versions/)"
    type: string
    default: "/models"
    group: "Model"

  - variable: persistence.size
    label: "Model Store Size"
    type: string
    default: "2Gi"
    group: "Model"

  - variable: persistence.storageClass
    label: "Storage Class"
    type: storageclass
    default: "local-path"
    group: "Model"

  # ---- Prediction log ----
  - variable: predictionLog.enabled
    label: "Log Predictions to the Edge Data Stock"
    description: "ISO/IEC 42001: B.6.2.8.1"
    type: boolean
    default: true
    group: "Prediction Log"

  - variable: predictionLog.host
    label: "Edge PostgreSQL Host"
    type: string
    default: "edge-postgresql.edge.svc.cluster.local"
    show_if: "predictionLog.enabled=true"
    group: "Prediction Log"

  - variable: predictionLog.existingSecret
    label: "Credentials Secret"
    type: string
    default: "edge-postgresql-auth"
    show_if: "predictionLog.enabled=true"
    group: "Prediction Log"

  # ---- Networking ----
  - variable: service.type
    label: "Service Type"
    type: enum
    default: "ClusterIP"
    options:
      - "ClusterIP"
      - "NodePort"
    group: "Networking"

  - variable: ingress.enabled
    label: "Enable Ingress"
    type: boolean
    default: false
    group: "Networking"

  - variable: ingress.hostname
    label: "Hostname"
    type: hostname
    default: "model.edge.local"
    show_if: "ingress.enabled=true"
    group: "Networking"

  # ---- Resources ----
  - variable: resources.requests.memory
    label: "Memory Request"
    type: string
    default: "384Mi"
    group: "Resources"

  - variable: resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "1Gi"
    group: "Resources"

  - variable: resources.limits.cpu
    label: "CPU Limit"
    type: string
    default: "1000m"
    group: "Resources"

  # ---- Scheduling ----
  - variable: nodeSelector.node-role\.kubernetes\.io/edge
    label: "Pin to Edge Nodes"
    type: string
    default: "true"
    group: "Scheduling"
