# =============================================================================
# FastAPI Model Deployment
# Tier: Edge | RA Component: Model (CMP-04)
# ISO/IEC 42001: B.6.2.6.2, B.6.2.6.4
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-fastapi-model.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-fastapi-model.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "edge-fastapi-model.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/app: {{ .Files.Get "files/app.py" | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "edge-fastapi-model.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fastapi-model
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "/app"]
          env:
            - name: HOME
              value: /tmp
            - name: MODEL_DIR
              value: {{ .Values.model.dir | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: LOG_PREDICTIONS
              value: {{ .Values.predictionLog.enabled | quote }}
            - name: DB_HOST
              value: {{ .Values.predictionLog.host | quote }}
            - name: DB_PORT
              value: {{ .Values.predictionLog.port | quote }}
            - name: DB_NAME
              value: {{ .Values.predictionLog.database | quote }}
            - name: DB_USER
              value: {{ .Values.predictionLog.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.predictionLog.existingSecret }}
                  key: {{ .Values.predictionLog.passwordKey }}
                  optional: true
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: model-storage
              mountPath: {{ .Values.model.dir }}
              readOnly: true
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: app
          configMap:
            name: {{ include "edge-fastapi-model.fullname" . }}-app
        - name: model-storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "edge-fastapi-model.fullname" . }}-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
