# =============================================================================
# FastAPI Model Server: Edge AI Inference
# Tier: Edge | RA Component: Model (CMP-04, edge), Model Technical
#             Performance Monitoring (CMP-10, edge subcomponent: /metrics)
# ISO/IEC 42001: B.6.2.6.2, B.6.2.6.4
# The application code lives in files/app.py (mounted from a ConfigMap), so
# no custom image or private registry is needed. The image bundles MLflow,
# scikit-learn, FastAPI, uvicorn, prometheus_client and psycopg2.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-fastapi-model"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.2.6.2: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.4: "true"
  mlops-iso42001.cigip-upv.es/CMP-04: "true"
  mlops-iso42001.cigip-upv.es/CMP-10: "true"
# END iso42001-labels

replicaCount: 1

image:
  repository: ghcr.io/burakince/mlflow
  tag: "2.22.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Model store written by edge-mlflow-sync (current.json + versions/).
model:
  dir: /models

# Prediction log in the edge data stock (B.6.2.8.1).
predictionLog:
  enabled: true
  host: edge-postgresql.edge.svc.cluster.local
  port: 5432
  database: zdm_edge
  user: edge_app
  existingSecret: edge-postgresql-auth
  passwordKey: password

logLevel: INFO

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hostname: model.edge.local
  tls: []

# PVC shared with edge-mlflow-sync (mounted read-only here).
persistence:
  enabled: true
  storageClass: local-path
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 1Gi

nodeSelector:
  node-role.kubernetes.io/edge: "true"
tolerations: []
affinity: {}

strategy:
  type: Recreate          # the model PVC is ReadWriteOnce

# /health answers as soon as the process runs; /ready reports whether a model
# is loaded (a fresh edge has no model until the first promotion).
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
