# =============================================================================
# Edge Version Control (MLflow Sync): platform registry -> edge
# Tier: Edge | RA Component: Version Control (CMP-03, edge), version
#             propagation flow (Version Control platform -> edge)
# ISO/IEC 42001: B.6.1.3.2, B.6.2.6.4, B.6.2.8.1
# A CronJob resolves models:/<name>@<alias> in the platform MLflow registry
# and, when the alias points to a new version, downloads it into the model
# store of edge-fastapi-model, switches it atomically, reloads the server and
# records the version history in the edge data stock.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-mlflow-sync"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.1.3.2: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.4: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.8.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-03: "true"
# END iso42001-labels

image:
  repository: ghcr.io/burakince/mlflow
  tag: "2.22.1"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

schedule: "*/2 * * * *"
suspend: false
backoffLimit: 1
activeDeadlineSeconds: 600
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

# Platform model registry (models are downloaded through the MLflow server;
# no object storage credentials at the edge).
registry:
  trackingUri: http://platform-mlflow.mlops.svc.cluster.local:5000
  modelName: zdm-anomaly-detector
  alias: champion

# Edge model server and its model store (PVC created by edge-fastapi-model).
modelServer:
  url: http://edge-fastapi-model.edge.svc.cluster.local:8000
  modelStoreClaim: edge-fastapi-model-storage
  modelDir: /models
  keepVersions: 3

# Version history table (model_versions) in the edge data stock.
versionLog:
  host: edge-postgresql.edge.svc.cluster.local
  port: 5432
  database: zdm_edge
  user: edge_app
  existingSecret: edge-postgresql-auth
  passwordKey: password

resources:
  requests:
    cpu: "50m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "768Mi"

nodeSelector:
  node-role.kubernetes.io/edge: "true"
tolerations: []
