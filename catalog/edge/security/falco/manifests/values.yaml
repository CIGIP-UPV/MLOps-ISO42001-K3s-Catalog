# =============================================================================
# Falco: Runtime Security Monitoring (edge and platform nodes)
# Helm chart: falcosecurity/falco
# Tier: Edge (runs on every node) | RA Component: Security Monitoring
#       (CMP-15, edge and platform)
# ISO/IEC 42001: B.6.2.6.7, B.6.2.8.1
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-falco"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.2.6.7: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.8.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-15: "true"
# END iso42001-labels

falco:
  podLabels: *iso42001Labels

  # Images from the Falco project's public ECR mirror (avoids the anonymous
  # Docker Hub rate limit).
  image:
    registry: public.ecr.aws

  # Modern eBPF probe: built into Falco, needs no kernel headers or driver
  # download (kernel >= 5.8 with BTF, e.g. Ubuntu 24.04).
  driver:
    kind: modern_ebpf
    loader:
      initContainer:
        image:
          registry: public.ecr.aws

  # K3s runs its own containerd.
  collectors:
    docker:
      enabled: false
    crio:
      enabled: false
    containerd:
      enabled: true
      socket: /run/k3s/containerd/containerd.sock

  falcoctl:
    image:
      registry: public.ecr.aws

  # ---------------------------------------------------------------------------
  # Rules for AI workloads (B.6.2.6.7), on top of the default Falco rules
  # ---------------------------------------------------------------------------
  customRules:
    ai-workload-rules.yaml: |-
      - list: ai_model_containers
        items: [fastapi-model, sync]

      - rule: Unexpected Model File Access
        desc: Read of the edge model store by a container other than the model server or the version sync job
        condition: >
          open_read and container and
          fd.name startswith /models/ and
          not container.name in (ai_model_containers)
        output: >
          Unexpected read of model file (user=%user.name container=%container.name
          image=%container.image.repository file=%fd.name k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
        priority: WARNING
        tags: [ai-security, model-theft]

      - rule: AI Container Shell Spawn
        desc: Shell started inside the edge model server
        condition: >
          spawned_process and container and
          container.name = "fastapi-model" and
          proc.name in (bash, sh, zsh, dash, ash)
        output: >
          Shell spawned in AI container (user=%user.name container=%container.name
          command=%proc.cmdline k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
        priority: CRITICAL
        tags: [ai-security, container-escape]

      - rule: Unexpected Outbound Connection from AI
        desc: Connection from the edge model server to an address outside the cluster networks
        condition: >
          outbound and container and
          container.name = "fastapi-model" and
          not fd.snet in ("10.42.0.0/16", "10.43.0.0/16")
        output: >
          Unexpected outbound connection from AI container (container=%container.name
          connection=%fd.name k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
        priority: WARNING
        tags: [ai-security, exfiltration]

  # ---------------------------------------------------------------------------
  # Falcosidekick: events to Loki (audit trail, B.6.2.8.1)
  # ---------------------------------------------------------------------------
  falcosidekick:
    enabled: true
    image:
      registry: public.ecr.aws
    podLabels: *iso42001Labels
    config:
      loki:
        hostport: "http://platform-loki.monitoring.svc.cluster.local:3100"
        minimumpriority: notice
        format: json
    resources:
      requests:
        cpu: "20m"
        memory: "32Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # Every node: security monitoring covers the edge and the platform.
  tolerations:
    - operator: Exists
      effect: NoSchedule
