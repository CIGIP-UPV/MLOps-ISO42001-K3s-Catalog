# =============================================================================
# Rancher Questions: Falco (Runtime Security Monitoring)
# ISO/IEC 42001: B.6.2.6.7, B.6.2.8.1
# Variables are prefixed with the subchart name (falco.). The AI workload
# rules are defined in values.yaml (falco.customRules).
# =============================================================================
categories:
  - "Edge"
  - "Security"

questions:
  - variable: falco.driver.kind
    label: "Driver"
    description: "modern_ebpf needs kernel >= 5.8 with BTF; kmod and ebpf build or download a probe"
    type: enum
    default: "modern_ebpf"
    options: ["modern_ebpf", "ebpf", "kmod", "auto"]
    group: "Driver"

  - variable: falco.collectors.containerd.socket
    label: "containerd Socket"
    description: "K3s: /run/k3s/containerd/containerd.sock"
    type: string
    default: "/run/k3s/containerd/containerd.sock"
    group: "Driver"

  - variable: falco.falcosidekick.enabled
    label: "Enable Falcosidekick"
    type: boolean
    default: true
    group: "Alert Routing"

  - variable: falco.falcosidekick.config.loki.hostport
    label: "Loki URL"
    type: string
    default: "http://platform-loki.monitoring.svc.cluster.local:3100"
    show_if: "falco.falcosidekick.enabled=true"
    group: "Alert Routing"

  - variable: falco.falcosidekick.config.loki.minimumpriority
    label: "Minimum Priority Sent to Loki"
    type: enum
    default: "notice"
    options: ["debug", "informational", "notice", "warning", "error", "critical", "alert", "emergency"]
    show_if: "falco.falcosidekick.enabled=true"
    group: "Alert Routing"

  - variable: falco.resources.requests.memory
    label: "Memory Request"
    type: string
    default: "256Mi"
    group: "Resources"

  - variable: falco.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "1Gi"
    group: "Resources"
