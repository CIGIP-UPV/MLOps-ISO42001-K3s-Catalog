# =============================================================================
# Edge Data Consolidation: edge data stock -> platform data stock
# Tier: Edge | RA Component: Data Stock (CMP-02), data consolidation flow
# ISO/IEC 42001: B.6.2.6.1, B.6.2.8.1
# A CronJob copies the rows added to the edge PostgreSQL since the last
# successful batch into the platform TimescaleDB. Every batch is logged in
# the consolidation_batches table of the platform (data provenance).
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-postgresql-sync"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.2.6.1: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.8.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-02: "true"
# END iso42001-labels

image:
  repository: public.ecr.aws/docker/library/postgres   # Docker official image, public ECR mirror
  tag: "16-alpine"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Identifier of this edge site in the platform data stock.
siteId: "edge-site-01"

# Run every 5 minutes; a batch never overlaps the previous one.
schedule: "*/5 * * * *"
suspend: false
# Maximum rows copied per table and batch.
batchSize: 50000
backoffLimit: 2
activeDeadlineSeconds: 600
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

# Source: edge data stock (edge-postgresql).
source:
  host: edge-postgresql.edge.svc.cluster.local
  port: 5432
  database: zdm_edge
  user: edge_app
  # Secret and key holding the password (created by install.sh).
  existingSecret: edge-postgresql-auth
  passwordKey: password

# Target: platform data stock (platform-timescaledb), role "sync".
target:
  host: platform-timescaledb.platform.svc.cluster.local
  port: 5432
  database: zdm_platform
  user: sync
  existingSecret: edge-postgresql-sync-target
  passwordKey: password

# Tables copied in each batch.
tables:
  sensorFeatures: true
  predictions: true

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

nodeSelector:
  node-role.kubernetes.io/edge: "true"
tolerations: []
