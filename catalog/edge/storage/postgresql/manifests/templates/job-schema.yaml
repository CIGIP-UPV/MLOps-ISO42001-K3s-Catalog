{{- if .Values.schemaJob.enabled }}
# =============================================================================
# Schema Job: brings an existing edge data stock up to date after every
# install and upgrade (the initdb scripts only run on the first start).
# Idempotent; the database is not restarted.
#   - predictions.features: input features of each prediction, so that
#     operator feedback can be used as labels (CMP-12, B.6.2.6.4)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-schema
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-postgresql.labels" . | nindent 4 }}
    {{- toYaml .Values.iso42001Labels | nindent 4 }}
data:
  migrate.sql: |
    ALTER TABLE IF EXISTS predictions ADD COLUMN IF NOT EXISTS features JSONB;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-schema
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-postgresql.labels" . | nindent 4 }}
    {{- toYaml .Values.iso42001Labels | nindent 4 }}
    app.kubernetes.io/component: schema
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "edge-postgresql.labels" . | nindent 8 }}
        {{- toYaml .Values.iso42001Labels | nindent 8 }}
        app.kubernetes.io/component: schema
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
      containers:
        - name: schema
          image: {{ .Values.schemaJob.image | quote }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              i=0
              until pg_isready -h "$PGHOST" -U postgres -q; do
                i=$((i + 1)); [ "$i" -ge 60 ] && { echo "database not ready"; exit 1; }; sleep 5
              done
              psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U postgres -d "$PGDATABASE" -q -f /schema/migrate.sql
              echo '{"component": "edge-postgresql", "event": "schema_applied"}'
          env:
            - name: PGHOST
              value: {{ .Release.Name | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgresql.auth.existingSecret }}, key: postgres-password }
          volumeMounts:
            - name: schema
              mountPath: /schema
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: schema
          configMap:
            name: {{ .Release.Name }}-schema
{{- end }}
