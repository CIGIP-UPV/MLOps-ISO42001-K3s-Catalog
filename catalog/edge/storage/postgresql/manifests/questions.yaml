# =============================================================================
# Rancher Questions: PostgreSQL (Edge Data Stock)
# ISO/IEC 42001: B.6.2.6.1, B.6.2.6.3, B.6.2.8.1
# Variables are prefixed with the subchart name (postgresql.).
# =============================================================================
categories:
  - "Edge"
  - "Storage"

questions:

  # ---- Authentication ----
  - variable: postgresql.auth.database
    label: "Database"
    description: "Edge data stock: sensor readings, predictions, feedback and model versions"
    type: string
    default: "zdm_edge"
    group: "Authentication"

  - variable: postgresql.auth.username
    label: "Application User"
    description: "Used by the ingestion flow, the model server and the sync jobs (the init script grants privileges to edge_app)"
    type: string
    default: "edge_app"
    group: "Authentication"

  - variable: postgresql.auth.existingSecret
    label: "Credentials Secret"
    description: "Secret with the keys postgres-password and password (created by install.sh)"
    type: string
    default: "edge-postgresql-auth"
    group: "Authentication"

  # ---- Persistence ----
  - variable: postgresql.primary.persistence.storageClass
    label: "Storage Class"
    type: storageclass
    default: "local-path"
    group: "Storage"

  - variable: postgresql.primary.persistence.size
    label: "Volume Size"
    type: string
    default: "10Gi"
    group: "Storage"

  # ---- Monitoring ----
  - variable: postgresql.metrics.enabled
    label: "Enable Prometheus Exporter"
    description: "postgres-exporter sidecar (ISO/IEC 42001: B.6.1.2.2)"
    type: boolean
    default: true
    group: "Monitoring"

  # ---- Resources ----
  - variable: postgresql.primary.resources.requests.cpu
    label: "CPU Request"
    type: string
    default: "100m"
    group: "Resources"

  - variable: postgresql.primary.resources.requests.memory
    label: "Memory Request"
    type: string
    default: "256Mi"
    group: "Resources"

  - variable: postgresql.primary.resources.limits.cpu
    label: "CPU Limit"
    type: string
    default: "1000m"
    group: "Resources"

  - variable: postgresql.primary.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "1Gi"
    group: "Resources"

  # ---- Scheduling ----
  - variable: postgresql.primary.nodeSelector.node-role\.kubernetes\.io/edge
    label: "Pin to Edge Nodes"
    type: string
    default: "true"
    group: "Scheduling"
