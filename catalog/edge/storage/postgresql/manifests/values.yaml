# =============================================================================
# PostgreSQL: Edge Data Stock (sensor data, predictions, feedback, versions)
# Helm chart: bitnami/postgresql
# Tier: Edge | RA Component: Data Stock (CMP-02, edge)
# ISO/IEC 42001: B.6.2.6.1, B.6.2.6.3, B.6.2.8.1
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-postgresql"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.2.6.1: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.3: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.8.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-02: "true"
# END iso42001-labels

postgresql:
  # The chart's own NetworkPolicy allows ingress from every namespace and all
  # egress; policies add up, so it would open the default deny of the catalog
  # (infrastructure/01-network-policies.yaml), which defines the conduits.
  # This chart sets it per role (primary.networkPolicy, readReplicas.networkPolicy).
  commonLabels: *iso42001Labels

  # Bitnami versioned images now live in docker.io/bitnamilegacy (frozen,
  # no new security patches). Replace with a maintained image in production.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r14

  architecture: standalone

  # ---------------------------------------------------------------------------
  # Authentication: credentials are read from a Secret created by install.sh
  # (keys postgres-password and password). Never commit passwords.
  # ---------------------------------------------------------------------------
  auth:
    database: zdm_edge
    username: edge_app
    existingSecret: edge-postgresql-auth

  primary:
    networkPolicy:
      enabled: false
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi

    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

    nodeSelector:
      node-role.kubernetes.io/edge: "true"

    # Scraped by the edge Prometheus Agent (postgres-exporter sidecar).
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"

    extendedConfiguration: |
      # Constrained edge environment
      max_connections = 50
      shared_buffers = 128MB
      work_mem = 4MB
      # Logging of data changes and connections (B.6.2.8.1)
      log_statement = 'mod'
      log_min_duration_statement = 500
      log_connections = on
      log_disconnections = on

    # Schema of the edge data stock. The scripts run once, on first start.
    # The GRANT statements assume auth.username = edge_app.
    initdb:
      scripts:
        01-schema.sql: |
          -- Raw sensor readings in long format, one row per tag and sample.
          -- Written by the ingestion flow (OPC UA gateway, MQTT, Node-RED).
          CREATE TABLE IF NOT EXISTS sensor_features (
            id            BIGSERIAL PRIMARY KEY,
            timestamp     TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            machine_id    TEXT NOT NULL,
            feature_name  TEXT NOT NULL,
            value         DOUBLE PRECISION
          );
          CREATE INDEX IF NOT EXISTS idx_features_time ON sensor_features (timestamp DESC);
          CREATE INDEX IF NOT EXISTS idx_features_id ON sensor_features (id);

          -- Prediction log (B.6.2.6.3, B.6.2.8.1)
          CREATE TABLE IF NOT EXISTS predictions (
            id            BIGSERIAL PRIMARY KEY,
            timestamp     TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            machine_id    TEXT NOT NULL,
            model_name    TEXT,
            model_version TEXT NOT NULL,
            input_hash    TEXT,
            score         DOUBLE PRECISION,
            label         TEXT,
            acknowledged  BOOLEAN DEFAULT FALSE
          );
          CREATE INDEX IF NOT EXISTS idx_predictions_time ON predictions (timestamp DESC);
          CREATE INDEX IF NOT EXISTS idx_predictions_machine ON predictions (machine_id);

          -- Operator feedback on predictions (B.6.1.3.3)
          CREATE TABLE IF NOT EXISTS operator_feedback (
            id              BIGSERIAL PRIMARY KEY,
            prediction_id   BIGINT REFERENCES predictions(id),
            timestamp       TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            operator_id     TEXT NOT NULL,
            feedback_type   TEXT NOT NULL CHECK (feedback_type IN ('correct', 'incorrect', 'uncertain')),
            comment         TEXT
          );

          -- Edge version control: history of model versions received from
          -- the platform registry (written by edge-mlflow-sync, B.6.1.3.2).
          CREATE TABLE IF NOT EXISTS model_versions (
            id             BIGSERIAL PRIMARY KEY,
            received_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            model_name     TEXT NOT NULL,
            model_version  TEXT NOT NULL,
            alias          TEXT,
            run_id         TEXT,
            source_uri     TEXT,
            artefact_sha256 TEXT,
            status         TEXT NOT NULL,
            UNIQUE (model_name, model_version, status)
          );

          -- System events log (B.6.2.8.1)
          CREATE TABLE IF NOT EXISTS system_events (
            id          BIGSERIAL PRIMARY KEY,
            timestamp   TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            source      TEXT NOT NULL,
            event_type  TEXT NOT NULL,
            severity    TEXT DEFAULT 'INFO',
            message     TEXT,
            metadata    JSONB
          );
          CREATE INDEX IF NOT EXISTS idx_events_time ON system_events (timestamp DESC);

          GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA public TO edge_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO edge_app;

  # ---------------------------------------------------------------------------
  # Metrics: postgres-exporter sidecar (B.6.1.2.2). No ServiceMonitor, so the
  # chart does not need the Prometheus Operator CRDs at the edge.
  # ---------------------------------------------------------------------------
  metrics:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgres-exporter
    serviceMonitor:
      enabled: false
    resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"

  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
