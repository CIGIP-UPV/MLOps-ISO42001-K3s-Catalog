# =============================================================================
# MongoDB: Edge Data Buffer (RAW data)
# Helm chart: bitnami/mongodb
# Tier: Edge | RA Component: Data Stock (CMP-02, edge), RAW Data
# ISO/IEC 42001: B.6.2.6.1
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-mongodb"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.2.6.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-02: "true"
# END iso42001-labels

mongodb:
  commonLabels: *iso42001Labels

  # Bitnami versioned images now live in docker.io/bitnamilegacy (frozen,
  # no new security patches). Replace with a maintained image in production.
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb
    tag: 7.0.14-debian-12-r3

  architecture: standalone

  # ---------------------------------------------------------------------------
  # Authentication: passwords come from a Secret created by install.sh
  # (keys mongodb-root-password and mongodb-passwords).
  # ---------------------------------------------------------------------------
  auth:
    enabled: true
    rootUser: root
    usernames:
      - nodered
    databases:
      - edge_buffer
    existingSecret: edge-mongodb-auth

  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  # Small WiredTiger cache for edge hardware.
  extraFlags:
    - "--wiredTigerCacheSizeGB=0.25"

  # ---------------------------------------------------------------------------
  # Collections with TTL indexes: the buffer cleans itself up.
  # ---------------------------------------------------------------------------
  initdbScripts:
    init.js: |
      db = db.getSiblingDB('edge_buffer');

      // Sensor data buffer, expires after 7 days
      db.createCollection('sensor_buffer');
      db.sensor_buffer.createIndex({ "timestamp": 1 }, { expireAfterSeconds: 604800 });
      db.sensor_buffer.createIndex({ "machine_id": 1, "timestamp": -1 });

      // Raw events buffer, expires after 3 days
      db.createCollection('raw_events');
      db.raw_events.createIndex({ "timestamp": 1 }, { expireAfterSeconds: 259200 });

      print('Edge buffer collections and indexes created.');

  # Scraped by the edge Prometheus Agent (mongodb-exporter sidecar).
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9216"

  metrics:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/mongodb-exporter
    serviceMonitor:
      enabled: false
    resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"

  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell

  nodeSelector:
    node-role.kubernetes.io/edge: "true"
