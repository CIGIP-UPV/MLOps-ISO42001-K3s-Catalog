# =============================================================================
# Rancher Questions: MongoDB (Edge Data Buffer)
# ISO/IEC 42001: B.6.2.6.1
# Variables are prefixed with the subchart name (mongodb.).
# =============================================================================
categories:
  - "Edge"
  - "Storage"

questions:

  # ---- Authentication ----
  - variable: mongodb.auth.existingSecret
    label: "Credentials Secret"
    description: "Secret with the keys mongodb-root-password and mongodb-passwords (created by install.sh)"
    type: string
    default: "edge-mongodb-auth"
    group: "Authentication"

  - variable: mongodb.auth.usernames[0]
    label: "Application User"
    description: "User for the Node-RED ingestion flows"
    type: string
    default: "nodered"
    group: "Authentication"

  - variable: mongodb.auth.databases[0]
    label: "Buffer Database"
    type: string
    default: "edge_buffer"
    group: "Authentication"

  # ---- Persistence ----
  - variable: mongodb.persistence.storageClass
    label: "Storage Class"
    type: storageclass
    default: "local-path"
    group: "Storage"

  - variable: mongodb.persistence.size
    label: "Volume Size"
    type: string
    default: "10Gi"
    group: "Storage"

  # ---- Monitoring ----
  - variable: mongodb.metrics.enabled
    label: "Enable Prometheus Exporter"
    type: boolean
    default: true
    group: "Monitoring"

  # ---- Resources ----
  - variable: mongodb.resources.requests.cpu
    label: "CPU Request"
    type: string
    default: "100m"
    group: "Resources"

  - variable: mongodb.resources.requests.memory
    label: "Memory Request"
    type: string
    default: "256Mi"
    group: "Resources"

  - variable: mongodb.resources.limits.cpu
    label: "CPU Limit"
    type: string
    default: "500m"
    group: "Resources"

  - variable: mongodb.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "1Gi"
    group: "Resources"

  # ---- Scheduling ----
  - variable: mongodb.nodeSelector.node-role\.kubernetes\.io/edge
    label: "Pin to Edge Nodes"
    type: string
    default: "true"
    group: "Scheduling"
