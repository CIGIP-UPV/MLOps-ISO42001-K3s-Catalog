# =============================================================================
# Rancher Questions: Fluent Bit (Log Collector and Forwarder)
# ISO/IEC 42001: B.6.2.8.1
# The pipeline (inputs, filters, Loki outputs) is defined in values.yaml.
# =============================================================================
categories:
  - "Edge"
  - "Monitoring"

questions:
  - variable: fluent-bit.image.tag
    label: "Fluent Bit Image Tag"
    description: "Empty uses the chart appVersion (cr.fluentbit.io registry)"
    type: string
    default: ""
    group: "General"

  - variable: fluent-bit.logLevel
    label: "Log Level"
    type: enum
    default: "info"
    options: ["error", "warning", "info", "debug"]
    group: "General"

  - variable: fluent-bit.resources.requests.memory
    label: "Memory Request"
    type: string
    default: "64Mi"
    group: "Resources"

  - variable: fluent-bit.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "256Mi"
    group: "Resources"

  - variable: fluent-bit.resources.limits.cpu
    label: "CPU Limit"
    type: string
    default: "300m"
    group: "Resources"
