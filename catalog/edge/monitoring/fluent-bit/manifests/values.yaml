# =============================================================================
# Fluent Bit: Log Collector and Forwarder
# Helm chart: fluent/fluent-bit
# Tier: Edge (runs on every node) | RA Component: Logger (CMP-09, edge and
#       platform)
# ISO/IEC 42001: B.6.2.8.1
# Collects the container logs of every node (edge and platform workloads,
# including the JSON event lines of the catalog jobs) and the Kubernetes API
# audit log, enriches them with Kubernetes metadata and ships them to Loki.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-fluent-bit"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.2.8.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-09: "true"
# END iso42001-labels

fluent-bit:
  labels: *iso42001Labels
  podLabels: *iso42001Labels

  # Image from the Fluent project registry (cr.fluentbit.io, not Docker Hub),
  # tag = chart appVersion.

  kind: DaemonSet

  # Logs of every tier: no node selector; tolerate control-plane taints.
  tolerations:
    - operator: Exists
      effect: NoSchedule

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "2020"
    prometheus.io/path: "/api/v2/metrics/prometheus"

  # Host paths: container logs, K3s containerd logs and the API audit log
  # (/var/log/kubernetes/audit, written by the audit policy of setup-ubuntu.sh).
  daemonSetVolumes:
    - name: varlog
      hostPath:
        path: /var/log
    - name: etcmachineid
      hostPath:
        path: /etc/machine-id
        type: File
  daemonSetVolumeMounts:
    - name: varlog
      mountPath: /var/log
    - name: etcmachineid
      mountPath: /etc/machine-id
      readOnly: true

  config:
    service: |
      [SERVICE]
          Daemon                    Off
          Flush                     2
          Log_Level                 info
          Parsers_File              /fluent-bit/etc/parsers.conf
          Parsers_File              /fluent-bit/etc/conf/custom_parsers.conf
          HTTP_Server               On
          HTTP_Listen               0.0.0.0
          HTTP_Port                 2020
          Health_Check              On
          # Filesystem buffer: logs survive a Loki outage (store and forward)
          storage.path              /var/log/flb-storage/
          storage.sync              normal
          storage.backlog.mem_limit 16M

    inputs: |
      [INPUT]
          Name              tail
          Tag               kube.*
          Path              /var/log/containers/*.log
          multiline.parser  cri
          DB                /var/log/flb_kube.db
          Mem_Buf_Limit     16MB
          Skip_Long_Lines   On
          Refresh_Interval  10
          storage.type      filesystem

      # Kubernetes API audit trail (control-plane node only; the path is
      # empty on the other nodes)
      [INPUT]
          Name              tail
          Tag               audit.*
          Path              /var/log/kubernetes/audit/audit.log
          Parser            k8s-audit
          DB                /var/log/flb_audit.db
          Mem_Buf_Limit     16MB
          storage.type      filesystem

    filters: |
      [FILTER]
          Name                kubernetes
          Match               kube.*
          Merge_Log           On
          Keep_Log            Off
          K8S-Logging.Parser  On
          K8S-Logging.Exclude On
          Labels              On
          Annotations         Off

    outputs: |
      [OUTPUT]
          Name                   loki
          Match                  kube.*
          Host                   platform-loki.monitoring.svc.cluster.local
          Port                   3100
          Labels                 job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], chart=$kubernetes['labels']['mlops-iso42001.cigip-upv.es/chart'], tier=$kubernetes['labels']['mlops-iso42001.cigip-upv.es/tier']
          Remove_Keys            kubernetes
          Line_Format            json
          Retry_Limit            False
          storage.total_limit_size 1G

      [OUTPUT]
          Name                   loki
          Match                  audit.*
          Host                   platform-loki.monitoring.svc.cluster.local
          Port                   3100
          Labels                 job=kube-apiserver-audit
          Line_Format            json
          Retry_Limit            False
          storage.total_limit_size 1G

    customParsers: |
      [PARSER]
          Name        k8s-audit
          Format      json
          Time_Key    requestReceivedTimestamp
          Time_Format %Y-%m-%dT%H:%M:%S.%LZ

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
