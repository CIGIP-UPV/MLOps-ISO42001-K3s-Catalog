# =============================================================================
# Rancher Questions: Prometheus Agent (Edge Metrics Collector)
# ISO/IEC 42001: B.6.1.2.2, B.6.2.6.1
# Variables are prefixed with the subchart name (prometheus.).
# =============================================================================
categories:
  - "Edge"
  - "Monitoring"

questions:

  - variable: prometheus.server.remoteWrite[0].url
    label: "Platform Prometheus Remote-Write URL"
    type: string
    default: "http://platform-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
    group: "Remote Write"

  - variable: prometheus.server.global.scrape_interval
    label: "Scrape Interval"
    type: string
    default: "15s"
    group: "Scraping"

  - variable: prometheus.server.global.external_labels.site_id
    label: "Site Identifier (external label)"
    type: string
    default: "edge-site-01"
    group: "Scraping"

  - variable: prometheus.server.persistentVolume.size
    label: "WAL Volume Size"
    description: "Buffers samples while the platform is unreachable"
    type: string
    default: "2Gi"
    group: "Storage"

  - variable: prometheus.server.persistentVolume.storageClass
    label: "Storage Class"
    type: storageclass
    default: "local-path"
    group: "Storage"

  - variable: prometheus.prometheus-node-exporter.enabled
    label: "Deploy node-exporter"
    description: "Only when the edge runs its own cluster; platform-prometheus already runs one per node"
    type: boolean
    default: false
    group: "Collectors"

  - variable: prometheus.kube-state-metrics.enabled
    label: "Deploy kube-state-metrics"
    description: "Only when the edge runs its own cluster"
    type: boolean
    default: false
    group: "Collectors"

  - variable: prometheus.server.resources.limits.memory
    label: "Memory Limit"
    type: string
    default: "512Mi"
    group: "Resources"

  - variable: prometheus.server.nodeSelector.node-role\.kubernetes\.io/edge
    label: "Pin to Edge Nodes"
    type: string
    default: "true"
    group: "Scheduling"
