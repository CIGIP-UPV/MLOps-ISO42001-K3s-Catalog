# =============================================================================
# Prometheus Agent: Edge Metrics Collector
# Helm chart: prometheus-community/prometheus (agent mode)
# Tier: Edge | RA Components: Infrastructure Technical Monitoring (CMP-08),
#             Model Technical Performance Monitoring (CMP-10, edge
#             subcomponent: scrapes the model server metrics)
# ISO/IEC 42001: B.6.1.2.2, B.6.2.6.1
# Scrapes the edge workloads that expose Prometheus annotations (model
# server, ingestion flow, gateway, brokers, databases) and forwards every
# sample to the platform Prometheus through remote-write.
# =============================================================================

# BEGIN iso42001-labels (generated by infrastructure/publish.py from CHART_META; do not edit)
# Traceability labels applied to every resource of this chart. Wrapper
# charts reference the anchor from the label hooks of the upstream chart.
iso42001Labels: &iso42001Labels
  iso42001: "true"
  mlops-iso42001.cigip-upv.es/chart: "edge-prometheus-agent"
  mlops-iso42001.cigip-upv.es/tier: "edge"
  mlops-iso42001.cigip-upv.es/B.6.1.2.2: "true"
  mlops-iso42001.cigip-upv.es/B.6.2.6.1: "true"
  mlops-iso42001.cigip-upv.es/CMP-08: "true"
  mlops-iso42001.cigip-upv.es/CMP-10: "true"
# END iso42001-labels

prometheus:
  commonMetaLabels: *iso42001Labels

  server:
    # Agent mode: no local TSDB and no rules, only scraping and remote-write.
    # The TSDB retention flags that the chart adds by default are invalid in
    # agent mode, so the whole flag list is set here.
    defaultFlagsOverride:
      - --enable-feature=agent
      - --config.file=/etc/config/prometheus.yml
      - --storage.agent.path=/data
      - --storage.agent.retention.max-time=6h
      - --web.enable-lifecycle

    global:
      scrape_interval: 15s
      external_labels:
        tier: edge
        site_id: edge-site-01

    # Platform Prometheus (kube-prometheus-stack, remote-write receiver on).
    remoteWrite:
      - url: "http://platform-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"

    # Write-ahead log kept across restarts (buffer while the platform is down).
    persistentVolume:
      enabled: true
      storageClass: local-path
      size: 2Gi

    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

    nodeSelector:
      node-role.kubernetes.io/edge: "true"

  # Configuration of the agent: no rule files; one scrape job per edge
  # namespace, driven by the prometheus.io/* pod annotations.
  serverFiles:
    prometheus.yml:
      rule_files: []
      scrape_configs:
        - job_name: edge-pods
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [edge, logging]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
            - source_labels: [__meta_kubernetes_pod_phase]
              action: drop
              regex: (Failed|Succeeded)
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - source_labels: [__meta_kubernetes_pod_label_mlops_iso42001_cigip_upv_es_chart]
              target_label: chart

  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  # kube-state-metrics and node-exporter already run cluster-wide with
  # platform-prometheus; enable them when the edge is a separate cluster
  # (a second node-exporter would collide on host port 9100).
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
