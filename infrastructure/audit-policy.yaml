# =============================================================================
# Kubernetes API audit policy for the K3s server (ISO/IEC 42001 B.6.2.8.1)
#
# Used by setup-ubuntu.sh (new servers) and enable-audit.sh (existing
# servers) through --kube-apiserver-arg=audit-policy-file=... The audit log
# is written to /var/log/kubernetes/audit/audit.log and shipped to Loki by
# edge-fluent-bit (job="kube-apiserver-audit").
#
# Without a policy file the API server records no audit events at all, even
# when audit-log-path is set.
# =============================================================================
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # Noise: health checks, leader election, events and node heartbeats.
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/metrics"]
  - level: None
    resources:
      - group: "coordination.k8s.io"
        resources: ["leases"]
      - group: ""
        resources: ["events"]
      - group: "events.k8s.io"
        resources: ["events"]
  - level: None
    users: ["system:kube-proxy", "system:apiserver"]
    verbs: ["watch", "get", "list"]
  - level: None
    userGroups: ["system:nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]

  # Secrets, ConfigMaps and tokens: who did what, never the content.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]

  # Access control changes (B.6.1.3.1).
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
      - group: "rbac.authorization.k8s.io"
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]

  # Changes to the AI system: workloads, jobs, models, policies, namespaces.
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    namespaces: ["edge", "logging", "falco", "platform", "mlops", "minio",
                 "monitoring", "argocd", "openbao", "security", "helpdesk"]
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["namespaces"]
      - group: "networking.k8s.io"
        resources: ["networkpolicies"]

  # Exec and port-forward into pods (interactive access).
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward"]

  # Everything else: metadata of write operations only.
  - level: Metadata
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
  - level: None
