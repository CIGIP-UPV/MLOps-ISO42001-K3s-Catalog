# =============================================================================
# Namespaces: tier-based separation for ISO/IEC 42001 zone segmentation
# ISA/IEC 62443: zones and conduits (see 01-network-policies.yaml)
# Every catalog namespace carries iso42001=true, which the NetworkPolicies
# use to identify the catalog zones. cert-manager and cattle-system are not
# declared here: they may belong to an existing Rancher installation.
# =============================================================================
---
# Edge workloads: ingestion, edge data stock, model server, version sync
apiVersion: v1
kind: Namespace
metadata:
  name: edge
  labels:
    tier: edge
    function: data-ingestion
    iso42001: 'true'
---
# Fluent Bit (DaemonSet on every node)
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    tier: edge
    function: logging
    iso42001: 'true'
---
# Falco runtime security (DaemonSet on every node)
apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    tier: edge
    function: security
    iso42001: 'true'
---
# Platform data stock: PostgreSQL metadata store and TimescaleDB
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    tier: platform
    function: data-management
    iso42001: 'true'
---
# MLflow, training jobs, Evidently
apiVersion: v1
kind: Namespace
metadata:
  name: mlops
  labels:
    tier: platform
    function: ai-lifecycle
    iso42001: 'true'
---
# Object storage and the enterprise document store buckets
apiVersion: v1
kind: Namespace
metadata:
  name: minio
  labels:
    tier: platform
    function: storage
    iso42001: 'true'
---
# Prometheus, Alertmanager, Loki, Grafana and dashboards
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    tier: platform
    function: monitoring
    iso42001: 'true'
---
# Argo CD
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    tier: platform
    function: gitops
    iso42001: 'true'
---
# OpenBao
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    tier: platform
    function: secrets
    iso42001: 'true'
---
# Keycloak
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    tier: enterprise
    function: access-management
    iso42001: 'true'
---
# Zammad
apiVersion: v1
kind: Namespace
metadata:
  name: helpdesk
  labels:
    tier: enterprise
    function: helpdesk
    iso42001: 'true'
